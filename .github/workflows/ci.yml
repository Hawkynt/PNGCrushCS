name: CI

# The gate a pull request has to pass. Nothing runs on a push to main: a pull request must be green
# to merge, so re-running the same matrix on the merge commit proves nothing and costs a machine —
# nightly.yml builds main after the merge instead.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      skip-coverage:
        description: >-
          Leaves the coverage leg out. A release sets it, because the report costs about two hours
          there and would gate the package push behind it. Phrased as "skip" rather than "run" on
          purpose: a pull request supplies no inputs at all, and an expression comparison casts both
          null and false to 0, so a "run: default true" flag would read as false on exactly the
          events that should run it.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  h265-branch-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/h265-fractional-motion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h265-fractional-motion
          fetch-depth: 0
      - name: Apply standards guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('Hawkynt.FileFormats.Video/Codecs/H265/H265InterPictureEncoder.cs')
          text = path.read_text()
          old = '''    var size = 1 << log2CbSize;
    var best = _Build(H265PartitionMode.Square);

    foreach (var mode in new[] { H265PartitionMode.HorizontalHalves, H265PartitionMode.VerticalHalves }) {
      var candidate = _Build(mode);
      if (candidate.Cost < best.Cost)
        best = candidate;
    }
'''
          new = '''    var size = 1 << log2CbSize;
    var best = _Build(H265PartitionMode.Square);

    // Clause 7.4.9.8 infers a transform split at depth zero for an inter coding unit whose
    // partition is not 2Nx2N when max_transform_hierarchy_depth_inter is zero. This writer's
    // residual path deliberately uses one transform tree leaf per coding unit, so do not select
    // a prediction shape whose required transform syntax that path cannot represent. Production
    // video sequences advertise one level of inter transform hierarchy and therefore still compete
    // square, horizontal-half and vertical-half prediction units normally.
    if (this._sps.MaxTransformHierarchyDepthInter > 0)
      foreach (var mode in new[] { H265PartitionMode.HorizontalHalves, H265PartitionMode.VerticalHalves }) {
        var candidate = _Build(mode);
        if (candidate.Cost < best.Cost)
          best = candidate;
      }
'''
          if text.count(old) != 1:
            raise SystemExit('Expected H265 partition-search block was not found exactly once.')
          path.write_text(text.replace(old, new, 1))
      - name: Commit source fix and restore CI
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265InterPictureEncoder.cs .github/workflows/ci.yml
          git commit -m "Guard HEVC half partitions by transform hierarchy"
          git push origin HEAD:feat/h265-fractional-motion

  ci:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      repo-readme: true
      solution: PngCrush.slnx
      dotnet-version: |
        8.x
        10.0.x
      os-matrix: '["ubuntu-latest","windows-latest"]'
      build-args: '-p:EnableWindowsTargeting=true'
      test-args: '--filter "TestCategory!=Regression&TestCategory!=Performance"'
      # The conformance oracles shell out to third-party tools, and a test whose tool is absent
      # reports Skipped -- which is not a failure, so the run goes green having checked nothing.
      # This repository carries 166 members claiming verification against ffmpeg and the hosted
      # runner has none, so every one of them has been Skipped on both required legs for as long
      # as they have existed. Installing it here is what turns those claims into a gate.
      #
      # The pull request is the right tier for this and the only one that gets it: smoke.yml runs
      # on every push and stays fast, exactly because it does not do this.
      #
      # Linux only, deliberately. The oracle runs once per claim and a second platform would buy
      # nothing but minutes; on Windows those tests keep skipping as before.
      setup-command: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
        fi
      # Wall-clock timings must not redden a pull request on a slow shared runner.
      advisory-test-args: '--filter "TestCategory=Performance"'
      # PngCrush references CompressionWorkbench, so the sibling sits next to this checkout.
      checkout-path: PNGCrushCS
      working-directory: PNGCrushCS
      siblings: '[{"repository":"Hawkynt/CompressionWorkbench","path":"CompressionWorkbench"}]'
      # One runner only: the committed reference must not depend on which machine produced it.
      package-readme-os: windows-latest
      package-readme-root: PNGCrushCS
      # Coverage does NOT gate a pull request. It costs 36 minutes against 8.5 for the same tests
      # uninstrumented here, and about two hours on the release path -- so as a required check it
      # was simply the slowest thing on the critical path, and a pull request sat waiting on a
      # reporting metric. coverage.yml measures it daily, where it has the time and blocks nobody.
      coverage: false
