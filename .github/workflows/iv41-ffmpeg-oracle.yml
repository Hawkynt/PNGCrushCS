name: IV41 FFmpeg oracle

on:
  push:
    branches: [video/indeo4-predictive-encoder]

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Run packed IV41 FFmpeg oracle
        working-directory: PNGCrushCS
        run: >
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj
          --configuration Release
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~Indeo4VideoEncoderTests.FFmpegDecodesPackedBidirectionalGroups"
          --logger "console;verbosity=normal"
