name: Regenerate video package docs

on:
  push:
    branches:
      - video-h263-elementary

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          project: Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj

      - name: Commit generated package docs
        shell: bash
        run: |
          set -euo pipefail
          git add Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate video package documentation"
          git push
