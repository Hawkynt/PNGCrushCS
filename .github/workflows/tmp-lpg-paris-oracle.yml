name: Temporary LPG Paris oracle research

on:
  push:
    branches:
      - research/lpg-paris-oracle

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search DiscMaster for Paris demo graphics
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request

          names = [
              'MS-LOGO.LPG', 'RainDay.pcx', 'mercury1.pcx', 'petesigl.pcx',
              'Robsig.pcx', 'Robsig1.pcx', 'PHONEP.LGO', 'Greyscal.Frm',
              'PACK1.PAK', 'PACK2.PAK'
          ]

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 LPG-format-research',
                  'Accept': 'application/json,text/html;q=0.9,*/*;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.geturl(), r.headers.get('content-type', ''), r.read().decode('utf-8', 'replace')

          print('=== DiscMaster filename search ===')
          seen = set()
          for name in names:
              variants = [
                  {'q': f'"{name}"', 'qfields': 'name', 'mode': 'deep', 'dedup': 'dedup', 'limit': '200', 'output': 'json'},
                  {'q': name, 'qfields': 'name', 'mode': 'deep', 'dedup': 'dedup', 'limit': '200', 'output': 'json'},
                  {'q': f'"{name}"', 'mode': 'deep', 'dedup': 'dedup', 'limit': '200', 'output': 'json'},
                  {'q': name, 'mode': 'deep', 'dedup': 'dedup', 'limit': '200'},
              ]
              for params in variants:
                  url = 'https://discmaster.textfiles.com/search?' + urllib.parse.urlencode(params)
                  try:
                      status, final_url, ctype, text = get(url)
                      key = (name, text[:4096])
                      if key in seen:
                          continue
                      seen.add(key)
                      print('\n---', name, params, '---')
                      print('STATUS', status, 'TYPE', ctype, 'URL', final_url, 'LEN', len(text))
                      print(text[:30000])
                      for match in sorted(set(re.findall(r'https?://[^\s"<>]+|/(?:view|file|browse)/[^\s"<>]+', text, re.I))):
                          if name.lower() in match.lower() or '/view/' in match.lower() or '/file/' in match.lower():
                              print('CANDIDATE', match[:2000])
                  except Exception as e:
                      print('\n---', name, params, '---')
                      print('ERR', type(e).__name__, str(e)[:1000])

          print('\n=== DiscMaster extension LPG search ===')
          for params in [
              {'extension': 'lpg', 'mode': 'deep', 'dedup': 'dedup', 'limit': '500', 'output': 'json'},
              {'extension': '.lpg', 'mode': 'deep', 'dedup': 'dedup', 'limit': '500', 'output': 'json'},
              {'q': '*.LPG', 'qfields': 'name', 'mode': 'deep', 'dedup': 'dedup', 'limit': '500', 'output': 'json'},
          ]:
              url = 'https://discmaster.textfiles.com/search?' + urllib.parse.urlencode(params)
              try:
                  status, final_url, ctype, text = get(url)
                  print('\n---', params, '---')
                  print('STATUS', status, 'TYPE', ctype, 'URL', final_url, 'LEN', len(text))
                  print(text[:60000])
              except Exception as e:
                  print('ERR', params, type(e).__name__, str(e)[:1000])
          PY

      - name: Search archive indexes for Paris demo graphics
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          names = [
              'MS-LOGO.LPG', 'RainDay.pcx', 'mercury1.pcx', 'petesigl.pcx',
              'Robsig.pcx', 'Robsig1.pcx', 'PHONEP.LGO', 'Greyscal.Frm',
              'PACK1.PAK', 'PACK2.PAK'
          ]

          def get(url, timeout=45):
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 LPG-format-research'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode('utf-8','replace')

          print('=== Internet Archive advanced search ===')
          for name in names:
              for q in [f'"{name}"', f'filename:"{name}"']:
                  params=[('q',q),('fl[]','identifier'),('fl[]','title'),('fl[]','description'),('rows','50'),('page','1'),('output','json')]
                  url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(params)
                  try:
                      data=json.loads(get(url))
                      docs=data.get('response',{}).get('docs',[])
                      print('\n',q,'hits',len(docs))
                      for d in docs[:50]: print(d.get('identifier',''), '|', d.get('title',''))
                  except Exception as e: print(q, type(e).__name__, e)

          print('\n=== Wayback basename wildcard probes ===')
          for name in names:
              params={'url':'*/'+name,'output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'digest','limit':'1000'}
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              try:
                  text=get(url,60)
                  print('\n',name)
                  print(text[:20000])
              except Exception as e: print(name,type(e).__name__,e)

          print('\n=== Common Crawl exact/wildcard basename probes ===')
          try:
              indexes=json.loads(get('https://index.commoncrawl.org/collinfo.json'))[:12]
          except Exception as e:
              print('index-list',type(e).__name__,e); indexes=[]
          for idx in indexes:
              api=idx.get('cdx-api') or idx.get('cdx_api')
              if not api: continue
              print('\nINDEX',idx.get('id'),api)
              for name in names[:7]:
                  queries=['*/'+name, '*/*'+name]
                  for q in queries:
                      url=api+'?'+urllib.parse.urlencode({'url':q,'output':'json','filter':'status:200'})
                      try:
                          text=get(url,30).strip()
                          if text: print('QUERY',q,'\n',text[:12000])
                      except Exception as e:
                          msg=str(e)
                          if '404' not in msg: print('ERR',q,type(e).__name__,msg[:300])

          print('\n=== urlscan.io public search ===')
          for name in names[:7]:
              for q in [f'filename:{name}', f'url:{name}']:
                  url='https://urlscan.io/api/v1/search/?'+urllib.parse.urlencode({'q':q,'size':100})
                  try:
                      data=json.loads(get(url))
                      rs=data.get('results',[])
                      print(q,'hits',len(rs))
                      for r in rs[:20]:
                          p=r.get('page',{}); print(p.get('url',''),p.get('domain',''))
                  except Exception as e: print(q,type(e).__name__,e)
          PY
