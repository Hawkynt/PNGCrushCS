name: Temporary DXF README regeneration

on:
  push:
    branches: [feature/dxf-writer]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Check out CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Regenerate image format README
        working-directory: PNGCrushCS
        env:
          UPDATE_IMAGE_FORMAT_README: '1'
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~FormatSupportReadmeTests"

      - name: Commit generated README
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- Hawkynt.FileFormats.Images/README.md)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Hawkynt.FileFormats.Images/README.md
            git commit -m "* regenerate image format support"
            git push origin HEAD:feature/dxf-writer
          }
