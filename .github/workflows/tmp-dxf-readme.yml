name: Temporary PE reference EOL cleanup

on:
  push:
    branches: [fix/peresource-metadata-safety]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize generated reference to repository LF convention
        shell: python
        run: |
          from pathlib import Path
          path = Path('Hawkynt.FileFormats.Images/REFERENCE.md')
          data = path.read_bytes()
          path.write_bytes(data.replace(b'\r\n', b'\n'))

      - name: Commit normalized reference
        run: |
          if git diff --quiet -- Hawkynt.FileFormats.Images/REFERENCE.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Images/REFERENCE.md
          git commit -m "* normalize generated image reference"
          git push origin HEAD:fix/peresource-metadata-safety
