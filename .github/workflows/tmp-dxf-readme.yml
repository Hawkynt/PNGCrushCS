name: Temporary PE resource docs sync

on:
  push:
    branches: [fix/peresource-metadata-safety]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CI-generated package docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34845059172 --repo "$GITHUB_REPOSITORY" --name package-readmes --dir /tmp/package-readmes

      - name: Copy generated image package docs
        run: |
          cp /tmp/package-readmes/PNGCrushCS/Hawkynt.FileFormats.Images/README.md Hawkynt.FileFormats.Images/README.md
          cp /tmp/package-readmes/PNGCrushCS/Hawkynt.FileFormats.Images/REFERENCE.md Hawkynt.FileFormats.Images/REFERENCE.md

      - name: Commit generated docs
        run: |
          if git diff --quiet -- Hawkynt.FileFormats.Images/README.md Hawkynt.FileFormats.Images/REFERENCE.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Images/README.md Hawkynt.FileFormats.Images/REFERENCE.md
          git commit -m "* sync generated image package docs"
          git push origin HEAD:fix/peresource-metadata-safety
