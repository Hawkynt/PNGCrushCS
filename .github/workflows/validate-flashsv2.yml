name: Validate Flash Screen Video 2 writer

on:
  push:
    branches: [feat/flashsv2-read-write]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode every key/inter frame with FFmpeg and compare pixels
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj
          --configuration Release
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~FlashSv2VideoEncoderOracleTests.FFmpegReadsEveryFrameExactly"
          --logger "console;verbosity=normal"
