name: Complete API summaries

on:
  push:
    branches: [docs/complete-public-api-summaries]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rewrite:
    runs-on: windows-latest
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Checkout CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Expand source-only audit scope
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          $fixerPath = 'tools/ApiDocSummaryFixer/Program.cs'
          $fixer = (Get-Content $fixerPath -Raw).Replace("`r`n", "`n")
          $videoRoot = '  Path.Combine(repositoryRoot, "Hawkynt.FileFormats.Video"),'
          $imageRoot = '  Path.Combine(repositoryRoot, "Hawkynt.FileFormats.Images"),'
          if (-not $fixer.Contains($imageRoot)) {
            $fixer = $fixer.Replace($videoRoot, $imageRoot + "`n" + $videoRoot)
            Set-Content $fixerPath $fixer -NoNewline -Encoding utf8
          }

          $imageGeneratorPath = 'FileFormat.Registry.Generator/ImageFormatGenerator.cs'
          $imageGenerator = (Get-Content $imageGeneratorPath -Raw).Replace("`r`n", "`n")
          $imageUnknown = '    sb.AppendLine("  Unknown,");'
          $imageUnknownDocs = '    sb.AppendLine("  /// <summary>Represents an unknown or unsupported image format.</summary>");' + "`n" + $imageUnknown
          if (-not $imageGenerator.Contains('Represents an unknown or unsupported image format.')) {
            $imageGenerator = $imageGenerator.Replace($imageUnknown, $imageUnknownDocs)
          }
          $imageLoop = (@'
    foreach (var format in formats)
      sb.Append("  ").Append(format.FormatId).AppendLine(",");
'@).Replace("`r`n", "`n")
          $imageLoopDocs = (@'
    foreach (var format in formats) {
      sb.Append("  /// <summary>Represents the ").Append(format.FormatId).AppendLine(" image format.</summary>");
      sb.Append("  ").Append(format.FormatId).AppendLine(",");
    }
'@).Replace("`r`n", "`n")
          if (-not $imageGenerator.Contains(' image format.</summary>')) {
            if (-not $imageGenerator.Contains($imageLoop)) { throw 'ImageFormat generator loop not found.' }
            $imageGenerator = $imageGenerator.Replace($imageLoop, $imageLoopDocs)
          }
          Set-Content $imageGeneratorPath $imageGenerator -NoNewline -Encoding utf8

          $videoGeneratorPath = 'FileFormat.Registry.Generator/VideoFormatGenerator.cs'
          $videoGenerator = (Get-Content $videoGeneratorPath -Raw).Replace("`r`n", "`n")
          $videoUnknown = '    sb.AppendLine("  Unknown,");'
          $videoUnknownDocs = '    sb.AppendLine("  /// <summary>Represents an unknown or unsupported video container format.</summary>");' + "`n" + $videoUnknown
          if (-not $videoGenerator.Contains('Represents an unknown or unsupported video container format.')) {
            $videoGenerator = $videoGenerator.Replace($videoUnknown, $videoUnknownDocs)
          }
          $videoLoop = (@'
    foreach (var container in discovery.Containers)
      sb.Append("  ").Append(container.FormatId).AppendLine(",");
'@).Replace("`r`n", "`n")
          $videoLoopDocs = (@'
    foreach (var container in discovery.Containers) {
      sb.Append("  /// <summary>Represents the ").Append(container.FormatId).AppendLine(" video container format.</summary>");
      sb.Append("  ").Append(container.FormatId).AppendLine(",");
    }
'@).Replace("`r`n", "`n")
          if (-not $videoGenerator.Contains(' video container format.</summary>')) {
            if (-not $videoGenerator.Contains($videoLoop)) { throw 'VideoFormat generator loop not found.' }
            $videoGenerator = $videoGenerator.Replace($videoLoop, $videoLoopDocs)
          }
          Set-Content $videoGeneratorPath $videoGenerator -NoNewline -Encoding utf8

      - name: Rewrite missing API summaries
        working-directory: PNGCrushCS
        run: dotnet run --project tools/ApiDocSummaryFixer/ApiDocSummaryFixer.csproj -- .

      - name: Verify rewrite is idempotent
        working-directory: PNGCrushCS
        run: dotnet run --project tools/ApiDocSummaryFixer/ApiDocSummaryFixer.csproj -- --check .

      - name: Restore image package
        working-directory: PNGCrushCS
        run: dotnet restore Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj -p:EnableWindowsTargeting=true

      - name: Build image package
        working-directory: PNGCrushCS
        run: dotnet build Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Restore video package
        working-directory: PNGCrushCS
        run: dotnet restore Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj -p:EnableWindowsTargeting=true

      - name: Build video package
        working-directory: PNGCrushCS
        run: dotnet build Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Restore UI package
        working-directory: PNGCrushCS
        run: dotnet restore Hawkynt.ImageTransformUI/Hawkynt.ImageTransformUI.csproj -p:EnableWindowsTargeting=true

      - name: Build UI package
        working-directory: PNGCrushCS
        run: dotnet build Hawkynt.ImageTransformUI/Hawkynt.ImageTransformUI.csproj -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Regenerate package API references for validation
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: PNGCrushCS
          configuration: Release
          project: |
            PNGCrushCS/Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj
            PNGCrushCS/Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj
            PNGCrushCS/Hawkynt.ImageTransformUI/Hawkynt.ImageTransformUI.csproj
          upload-artifact: 'false'

      - name: Check source diffs
        working-directory: PNGCrushCS
        shell: bash
        run: git diff --check

      - name: Commit C# documentation changes only
        working-directory: PNGCrushCS
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Images Hawkynt.FileFormats.Video Hawkynt.ImageTransformUI \
            FileFormat.Core.Generators/HeaderSerializerGenerator.cs \
            FileFormat.Registry.Generator/ImageFormatGenerator.cs \
            FileFormat.Registry.Generator/VideoFormatGenerator.cs
          git reset -- \
            Hawkynt.FileFormats.Images/README.md Hawkynt.FileFormats.Images/REFERENCE.md \
            Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md \
            Hawkynt.ImageTransformUI/README.md Hawkynt.ImageTransformUI/REFERENCE.md || true
          if git diff --cached --quiet; then
            echo "No C# documentation changes produced."
          else
            git commit -m "Document complete image and video APIs"
            git push
          fi

      - name: Require zero missing reference summaries
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          $referenceFiles = @(
            'Hawkynt.FileFormats.Images/REFERENCE.md',
            'Hawkynt.FileFormats.Video/REFERENCE.md',
            'Hawkynt.ImageTransformUI/REFERENCE.md'
          )
          $missing = @()
          foreach ($file in $referenceFiles) {
            $lineNumber = 0
            foreach ($line in Get-Content $file) {
              ++$lineNumber
              if ($line -match '^\| .+ \| .+ \|  \|$') {
                $missing += "${file}:${lineNumber}: $line"
              }
            }
          }
          if ($missing.Count -ne 0) {
            $missing | ForEach-Object { Write-Host $_ }
            throw "$($missing.Count) public/protected API members still have no summary."
          }
          Write-Host 'All generated API reference members have summaries.'
