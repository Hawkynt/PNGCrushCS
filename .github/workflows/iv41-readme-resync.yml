name: IV41 README resync

on:
  push:
    branches: [video/indeo4-predictive-encoder]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download canonical package README
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34948023266 -n package-readmes -D /tmp/package-readmes

      - name: Apply canonical README
        run: cp /tmp/package-readmes/PNGCrushCS/Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/README.md

      - name: Commit canonical README
        shell: bash
        run: |
          rm .github/workflows/iv41-readme-resync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Video/README.md .github/workflows/iv41-readme-resync.yml
          git diff --cached --check
          git commit -m "Sync generated video package README"
          git push
