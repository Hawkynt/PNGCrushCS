name: Office binary diagnostics

on:
  push:
    branches: [feature/office-binary-writers]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Stamp versions
        uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: stamp
          path: PNGCrushCS

      - name: Restore
        working-directory: PNGCrushCS
        run: dotnet restore PngCrush.slnx -p:EnableWindowsTargeting=true

      - name: Build with captured diagnostics
        shell: bash
        working-directory: PNGCrushCS
        run: |
          set -o pipefail
          dotnet build PngCrush.slnx --configuration Release --no-restore -p:EnableWindowsTargeting=true 2>&1 | tee office-binary-build.log

      - name: Run focused legacy Office writer tests
        working-directory: PNGCrushCS
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~FileFormat.Excel.Tests.ExcelBinaryFileTests.Writer_CreatesCompoundBiffWorkbookAndRoundTrips|FullyQualifiedName~FileFormat.Word.Tests.WordBinaryFileTests.Writer_CreatesNativeWordBinaryDocumentAndRoundTrips|FullyQualifiedName~FileFormat.PowerPoint.Tests.PowerPointBinaryPresentationTests.Writer_CreatesCompleteBinaryPresentationAndRoundTrips"
          --logger "trx;LogFileName=office-binary-focused.trx"
          --results-directory TestResults

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-binary-build-diagnostics
          path: |
            PNGCrushCS/office-binary-build.log
            PNGCrushCS/TestResults/office-binary-focused.trx
          if-no-files-found: warn
