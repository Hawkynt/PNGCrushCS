name: Temporary CYUV README sync

on:
  push:
    branches: [video/creative-yuv-encoder]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video/creative-yuv-encoder
          fetch-depth: 0

      - name: Sync video support ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.Video/README.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "builds, 46 of them. The two",
                  "builds, 47 of them. The two",
              ),
              (
                  "| [Creative YUV (CYUV)](https://wiki.multimedia.cx/index.php/Creative_YUV) | ✅ | — | — | `cyuv`; 4:1:1 per-row difference coding against three per-frame tables. Widths that are not a whole number of four-pixel groups refused | [Ferguson, `cyuv.txt`](https://multimedia.cx/mirror/cyuv.txt) |",
                  "| [Creative YUV (CYUV)](https://wiki.multimedia.cx/index.php/Creative_YUV) | ✅ | ✅ | ffmpeg | `cyuv`; decoder accepts the 4:1:1 per-row difference coding and the real uncompressed UYVY 4:2:2 packet shape. The encoder deliberately writes the latter, bottom-up, because the published differential format specifies how to read its three per-frame tables but not how an encoder chooses them. Widths that are not a whole number of four-pixel groups refused | [Ferguson, `cyuv.txt`](https://multimedia.cx/mirror/cyuv.txt) |",
              ),
              (
                  "46 codecs of the 100 read can also be written",
                  "47 codecs of the 100 read can also be written",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one README occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit README sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/README.md
          git diff --cached --check
          git commit -m "Update Creative YUV support ledger"
          git push origin HEAD:video/creative-yuv-encoder
