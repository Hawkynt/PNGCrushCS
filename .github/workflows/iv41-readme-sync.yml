name: IV41 README sync

on:
  push:
    branches: [video/indeo4-predictive-encoder]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated package README
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34843484714 -n package-readmes -D /tmp/package-readmes

      - name: Apply generated README and IV41 capability row
        shell: bash
        run: |
          cp /tmp/package-readmes/PNGCrushCS/Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/README.md
          python - <<'PY'
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.Video/README.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "| [Intel Indeo Video Interactive 4](https://en.wikipedia.org/wiki/Indeo) |"
          replacement = "| [Intel Indeo Video Interactive 4](https://en.wikipedia.org/wiki/Indeo) | ⚠️ | ✅ | ffmpeg | `IV41`; picture and band headers, the wavelet subdivision into one band or four, tiling, the slant and Haar transforms in two dimensions and in each one alone at both block sizes, the band that stores its samples untransformed, the fifteen scan patterns a band header may select by index, its nine eight-by-eight dequantisation matrices and its five four-by-four ones, run-value coded coefficients with the nine built-in maps and the per-band permutations of them, the sixteen built-in codebooks and the custom ones a stream spells out, whole- and half-sample motion compensation, bidirectional frames including the second frame Indeo 4 packs into the first one's packet, and the Haar recomposition of a scalable picture. Refused by name: the five of the format's eighteen transforms Intel specified and never shipped — the four discrete cosine transforms and the four-by-four pass-through — a band spelling out a scan pattern or a dequantisation matrix of its own, and a chrominance subsampling other than YVU9. The encoder writes YVU9 I/P/B prediction with one band per plane, 256-sample luma tiles, direct 8x8 luminance and 4x4 Haar chrominance, quantiser zero and custom fixed six-bit codebooks. Display-order triples use IV4's native packed-reference transport: the future P picture is encoded against the reconstructed past anchor and packed behind the preceding I picture, the intervening B picture predicts from both reconstructed anchors, and a null-last packet releases the deferred future picture in display order; a short tail flushes as ordinary I/P. P and B macroblocks search non-zero whole- and half-sample motion within the padded band buffers, B macroblocks choose forward, backward or averaged prediction by squared error, and zero-residual zero-motion forward blocks use the repeat-reference shorthand. Anchors are reconstructed through the decoder before reuse so prediction follows decoder state rather than source pixels. A block that holds nothing but the running DC prediction goes into the coded-block pattern as uncoded, because a coded block opening on its end-of-block symbol is block data out of step with the bitstream rather than an empty block. RGB round trips are lossy because IV41 subsamples chrominance 4:1:0. Measured against ffmpeg 9.0.1 on five decoder clips from `samples.ffmpeg.org`: 17,261 pictures, 1,910,624,004 samples of `yuv410p`, no difference on any plane of any frame | [FFmpeg `indeo4.c`](https://github.com/FFmpeg/FFmpeg/blob/master/libavcodec/indeo4.c) |"

          matches = [index for index, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
            raise SystemExit(f"Expected exactly one IV41 row, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit generated README
        shell: bash
        run: |
          rm .github/workflows/iv41-readme-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Video/README.md .github/workflows/iv41-readme-sync.yml
          git diff --cached --check
          git commit -m "Update IV41 README for predictive encoding"
          git push
