name: MSZH documentation sync

on:
  push:
    branches: [codec/lcl-mszh-read-write]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codec/lcl-mszh-read-write

      - name: Update generated support claims and codec notes
        shell: python
        run: |
          from pathlib import Path

          readme_path = Path("Hawkynt.FileFormats.Video/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          replacements = {
              "builds, 46 of them": "builds, 47 of them",
              "46 codecs of the 100 read can also be written": "47 codecs of the 100 read can also be written",
          }
          for old, new in replacements.items():
              if readme.count(old) != 1:
                  raise SystemExit(f"README replacement anchor occurs {readme.count(old)} times: {old!r}")
              readme = readme.replace(old, new)

          lines = readme.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("| [LCL MSZH](")]
          if len(matches) != 1:
              raise SystemExit(f"expected one LCL MSZH support row, found {len(matches)}")
          lines[matches[0]] = (
              "| [LCL MSZH](https://wiki.multimedia.cx/index.php/Lossless_Codec_Libraries) | ⚠️ | ✅ | ffmpeg | "
              "`MSZH`; RGB24 only on decode. Reads compressed, uncompressed and two-section MSZH packets. "
              "The encoder writes single-section bottom-up RGB24 with DWORD-padded rows, using MSZH back-references "
              "when they shrink the frame and the reference decoder's equal-size raw-frame form otherwise | "
              "[FFmpeg `lcldec.c`](https://github.com/FFmpeg/FFmpeg/blob/master/libavcodec/lcldec.c) |"
          )
          readme_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          notes_path = Path("Hawkynt.FileFormats.Video/codec-notes.md")
          notes = notes_path.read_text(encoding="utf-8")
          heading = "### Lossless Codec Library (MSZH)"
          if heading not in notes:
              zlib = notes.index("### Lossless Codec Library (ZLIB)")
              following = notes.index("\n### ", zlib + 1)
              section = r'''

### Lossless Codec Library (MSZH)

The wrapper comes from Roberto Togni's *Description of the LCL codecs (MSZH and ZLIB)*: the
eight-byte `BITMAPINFOHEADER` trailer, codec 1, RGB24 image type 2, compression 0, and the fact that
MSZH copies blocks from bytes already decoded in the same frame. That document is GNU FDL 1.2 and
leaves the actual match code as an unfilled placeholder. The interoperable command layout is instead
measured from FFmpeg's `libavcodec/lcldec.c`, LGPL-2.1-or-later: one mask byte covers eight commands
most-significant bit first; a zero bit carries four literal bytes; a one bit carries a little-endian
16-bit descriptor with an eleven-bit backward byte distance and a five-bit four-byte-group count minus
one. The decoder adaptation retains FFmpeg's overlapping-copy and defensive zero-distance behaviour.

The encoder is independent rather than a translation: FFmpeg has an LCL ZLIB encoder but no MSZH
encoder. It writes BGR24 bottom row first with every row padded to four bytes, looks up the most recent
equal four-byte group inside the 2047-byte window, extends a match through at most 32 groups (128
bytes), and emits the raw padded picture whenever the compressed packet would be no smaller. That last
form is not an invention: FFmpeg's MSZH decoder explicitly recognizes an RGB24 packet whose length is
the padded frame size as uncompressed even when the stream header says compression 0. Every emitted
packet is independent and the writer leaves the multithread, null-frame and PNG-filter flags clear.
The YUV byte orders and the multithread writer's split fields remain deliberately unwritten because
the published description leaves them unspecified.

The command bytes were checked outside this package before the encoder was registered: a 4x1 frame
whose first four bytes repeat encoded as `40 01 02 03 04 04 08`; muxed as `MSZH`, FFmpeg 7.1.5 decoded
it to the intended twelve BGR bytes. The equal-size raw fallback was checked the same way. The
`EncoderOracleTests` fixture keeps the `ffmpeg` claim executable for complete AVI clips rather than
letting the writer's own decoder certify it.
'''
              notes = notes[:following] + section + notes[following:]
              notes_path.write_text(notes, encoding="utf-8")

          decoder_path = Path("Hawkynt.FileFormats.Video/Codecs/MszhVideoDecoder.cs")
          decoder = decoder_path.read_text(encoding="utf-8")
          old = "A zero backward distance produces zero bytes, matching the reference decoder's defined defensive"
          new = "A zero backward distance produces zero-valued bytes, matching the reference decoder's defensive"
          if decoder.count(old) != 1:
              raise SystemExit(f"decoder wording anchor occurs {decoder.count(old)} times")
          decoder_path.write_text(decoder.replace(old, new), encoding="utf-8")

      - name: Commit synchronized documentation
        shell: bash
        run: |
          rm .github/workflows/.mszh-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document LCL MSZH read/write support"
          git push origin HEAD:codec/lcl-mszh-read-write
