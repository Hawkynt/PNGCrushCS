name: Finish JPEG XR frequency-alpha support

on:
  push:
    branches: [fix/image-format-warning-coverage]
    paths: ['.github/workflows/jxr-finish.yml']

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: ../CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Patch frequency Y-only decode and conformance evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          codec_path = Path('Hawkynt.FileFormats.Images/Formats/JpegXr/Reference/JxrCodestream.cs')
          text = codec_path.read_text()

          start = text.index('    private static void DecodeFrequencyIntoPlanes')
          end = text.index('\n    /// <summary>\n    /// Encode a <paramref name="width"', start)
          block = text[start:end]

          old_sig = '''    private static void DecodeFrequencyIntoPlanes(ref BitReader reader, byte[] padded, int[][] planes,
              int mbCols, int mbRows, bool noFlexBits, int[] dcQp, int[] lpQp, int[] hpQp)
          '''
          new_sig = '''    private static void DecodeFrequencyIntoPlanes(ref BitReader reader, byte[] padded, int[][] planes,
              int mbCols, int mbRows, bool noFlexBits, int[] dcQp, int[] lpQp, int[] hpQp,
              ColorFormat colorFormat = ColorFormat.Yuv444, int channels = 3)
          '''
          if old_sig not in block:
              raise SystemExit('DecodeFrequencyIntoPlanes signature not found')
          block = block.replace(old_sig, new_sig, 1)
          block = block.replace('var ctx = new CodingContext(ColorFormat.Yuv444, 3) { NoFlexBits = noFlexBits };',
                                'var ctx = new CodingContext(colorFormat, channels) { NoFlexBits = noFlexBits };', 1)
          block = block.replace('var tile = new TileCoder(mbCols);',
                                'var tile = new TileCoder(mbCols, channels, colorFormat);', 1)
          block = block.replace('var block = new Macroblock(3);', 'var block = new Macroblock(channels);', 1)
          block = block.replace('for (var ch = 0; ch < 3; ch++)', 'for (var ch = 0; ch < channels; ch++)', 1)
          block = block.replace('Decode a single-tile FREQUENCY-mode YUV444 codestream into the whole-image planes.',
                                'Decode a single-tile FREQUENCY-mode codestream into the whole-image planes.')
          text = text[:start] + block + text[end:]

          gray_start = text.index('    public static (int width, int height, int[] y) DecodeGray')
          gray_end = text.index('    public static (int width, int height, float[] y) DecodeGrayF32', gray_start)
          gray = text[gray_start:gray_end]
          frequency_refusal = '''        if (ih.FrequencyModeCodestreamFlag)
              throw new NotSupportedException("JxrCodestream decodes SPATIAL codestreams only.");
          '''
          if frequency_refusal not in gray:
              raise SystemExit('Gray frequency refusal not found')
          gray = gray.replace(frequency_refusal, '', 1)
          gray = gray.replace('Decode a single-tile SPATIAL Y-only BD8 JXR codestream back into a BD8 grayscale',
                              'Decode a single-tile SPATIAL or FREQUENCY Y-only JXR codestream back into a grayscale', 1)
          planes_line = '        var planes = OverlapTransform.AllocatePlanes(mbCols, mbRows, 1);\n'
          if planes_line not in gray:
              raise SystemExit('Gray plane allocation not found')
          gray = gray.replace(planes_line,
                              planes_line + '        bool noFlexBits = bands == JxrBandsPresent.NoFlexbits;\n', 1)
          spatial_else = '''        else
              {
                  ReadProfileLevelInfo(ref reader);
          '''
          frequency_else = '''        else if (ih.FrequencyModeCodestreamFlag)
              {
                  DecodeFrequencyIntoPlanes(ref reader, padded, planes, mbCols, mbRows, noFlexBits,
                                            [qDc.Qp], [qLp.Qp], [qHp.Qp], ColorFormat.YOnly, 1);
              }
              else
              {
                  ReadProfileLevelInfo(ref reader);
          '''
          if spatial_else not in gray:
              raise SystemExit('Gray spatial decode branch not found')
          gray = gray.replace(spatial_else, frequency_else, 1)
          gray = gray.replace('var ctx = new CodingContext(ColorFormat.YOnly, 1) { NoFlexBits = bands == JxrBandsPresent.NoFlexbits };',
                              'var ctx = new CodingContext(ColorFormat.YOnly, 1) { NoFlexBits = noFlexBits };', 1)
          text = text[:gray_start] + gray + text[gray_end:]
          codec_path.write_text(text)

          test_path = Path('Tests/Hawkynt.FileFormats.Images.Tests/Formats/JpegXr/RoundTripTests.cs')
          tests = test_path.read_text()
          ignore = '  [Ignore("Frequency-mode JPEG XR is not implemented; the decoder refuses it by name.")]\n'
          if ignore not in tests:
              raise SystemExit('Expected ignored JXRLib fixture test not found')
          tests = tests.replace(ignore, '', 1)
          old_doc = '''  /// <summary>
            /// The fixture is a FREQUENCY-mode codestream and the vendored reference decoder is SPATIAL-only,
            /// which it says by name rather than returning something wrong.
            /// </summary>
            /// <remarks>
            /// Kept rather than deleted because the fixture is sound and the refusal is the right behaviour
            /// until frequency-mode decoding exists. Its own alpha byte count was also wrong — it stated the
            /// whole file length, 454, where the alpha runs from 334 to the end, 120 bytes — and that is
            /// corrected here so the test fails on the capability that is missing rather than on a fixture
            /// that could never have parsed.
            /// </remarks>
          '''
          new_doc = '''  /// <summary>
            /// Decodes glencoesoftware/JXRLib's independent frequency-order BGRA fixture through the public
            /// T.833 reader, including its separate frequency-order Y-only planar-alpha codestream.
            /// </summary>
          '''
          if old_doc in tests:
              tests = tests.replace(old_doc, new_doc, 1)
          test_path.write_text(tests)

          readme_path = Path('Hawkynt.FileFormats.Images/README.md')
          readme = readme_path.read_text()
          old_row = '| [JPEG XR](https://en.wikipedia.org/wiki/JPEG_XR) | `.jxr`, `.wdp`, `.hdp` | ⚠️ | ⚠️ | — | `image/jxr` | [ITU-T T.832](https://www.itu.int/rec/T-REC-T.832) |'
          new_row = '| [JPEG XR](https://en.wikipedia.org/wiki/JPEG_XR) | `.jxr`, `.wdp`, `.hdp` | ✅ | ✅ | — | `image/jxr` | [ITU-T T.832](https://www.itu.int/rec/T-REC-T.832) |'
          if old_row not in readme:
              raise SystemExit('JPEG XR README row not found')
          readme = readme.replace(old_row, new_row, 1)
          stale = ' JPEG XR recognizes real containers but deliberately refuses the current incorrect real-file pixel output.'
          if stale not in readme:
              raise SystemExit('Stale JPEG XR README caveat not found')
          readme = readme.replace(stale, '', 1)
          readme_path.write_text(readme)

          conf_path = Path('Hawkynt.FileFormats.Images/MODERN_FORMAT_CONFORMANCE.md')
          conf = conf_path.read_text()
          marker = 'Such adapter coverage must not be confused with the former codec-conformance failure.\n'
          addition = ('Such adapter coverage must not be confused with the former codec-conformance failure. '
                      'The independently produced frequency-order BGRA fixture now passes through the public reader, '
                      'including its separate frequency-order alpha plane, so the README read/write row is promoted to `✅`/`✅`.\n')
          if marker not in conf:
              raise SystemExit('JPEG XR conformance marker not found')
          conf = conf.replace(marker, addition, 1)
          conf_path.write_text(conf)
          PY

      - name: Stamp versions
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Run JPEG XR tests
        run: dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj --configuration Release -p:EnableWindowsTargeting=true --filter "FullyQualifiedName~JpegXr" --logger "console;verbosity=normal"

      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Images/Formats/JpegXr/Reference/JxrCodestream.cs \
                  Tests/Hawkynt.FileFormats.Images.Tests/Formats/JpegXr/RoundTripTests.cs \
                  Hawkynt.FileFormats.Images/README.md \
                  Hawkynt.FileFormats.Images/MODERN_FORMAT_CONFORMANCE.md
          git commit -m "Complete JPEG XR frequency alpha interoperability"
          git push
