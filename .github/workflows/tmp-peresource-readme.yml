name: Temporary PeResource README regeneration

on:
  push:
    branches: [feat/peresource-read-write]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Check out CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update read-only rationale
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          $path = 'Hawkynt.FileFormats.Images/README.md'
          $text = [IO.File]::ReadAllText($path)
          $old = 'These 9 entries read but have no writer; each is a decision, not an oversight. **Not bounded** (an encoder or a model this package does not have): PeResource, Fpx (executable, OLE and compound-document containers). **Holders of other files rather than pictures of their own**: IconLibrary, Ipg, Sdg, Cdr, Cmx — an icon library, a tileset and a gallery carry whole files of other formats, and CorelDRAW''s streams are vector scenes whose raster part is only an embedded preview, so writing any of them means deciding what belongs in a collection or composing a drawing, neither of which is serialising a picture. **Deliberately not written** because a file built from arbitrary pixels would not be what the name promises: EmbeddedDib, CartesMichelin.'
          $new = 'These 8 entries read but have no writer; each is a decision, not an oversight. **Not bounded** (an encoder or a model this package does not have): Fpx (OLE compound-document container). **Holders of other files rather than pictures of their own**: IconLibrary, Ipg, Sdg, Cdr, Cmx — an icon library, a tileset and a gallery carry whole files of other formats, and CorelDRAW''s streams are vector scenes whose raster part is only an embedded preview, so writing any of them means deciding what belongs in a collection or composing a drawing, neither of which is serialising a picture. **Deliberately not written** because a file built from arbitrary pixels would not be what the name promises: EmbeddedDib, CartesMichelin.'
          if (-not $text.Contains($old)) { throw 'PeResource read-only paragraph no longer matches the expected source text.' }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new))

      - name: Regenerate image format README
        working-directory: PNGCrushCS
        env:
          UPDATE_IMAGE_FORMAT_README: '1'
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~FormatSupportReadmeTests"

      - name: Commit generated README
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- Hawkynt.FileFormats.Images/README.md)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Hawkynt.FileFormats.Images/README.md
            git commit -m "* regenerate image format support"
            git push origin HEAD:feat/peresource-read-write
          }
