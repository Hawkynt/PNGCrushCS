name: VP8 video encoder maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-document:
    if: github.head_ref == 'feature/vp8-video-encoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: PNGCrushCS
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Restore
        working-directory: PNGCrushCS
        run: dotnet restore PngCrush.slnx -p:EnableWindowsTargeting=true

      - name: Build
        working-directory: PNGCrushCS
        run: dotnet build PngCrush.slnx --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Update VP8 support ledger
        working-directory: PNGCrushCS
        shell: python
        run: |
          from pathlib import Path

          readme_path = Path('Hawkynt.FileFormats.Video/README.md')
          text = readme_path.read_text(encoding='utf-8')

          replacements = {
              'builds, 46 of them.': 'builds, 47 of them.',
              "Microsoft's MPEG-4, ASUS V1 and V2, Apple Video, H.261, Hap, Apple ProRes, id RoQ —":
                  "Microsoft's MPEG-4, ASUS V1 and V2, Apple Video, H.261, Hap, Apple ProRes, VP8, id RoQ —",
              '| [VP8 (RFC 6386)](https://en.wikipedia.org/wiki/VP8) | ✅ | — | — | RFC 6386 entire. Reserved bitstream versions and the reserved colour-space/clamping fields refused | [RFC 6386](https://www.rfc-editor.org/rfc/rfc6386) |':
                  '| [VP8 (RFC 6386)](https://en.wikipedia.org/wiki/VP8) | ✅ | ✅ | ffmpeg | RFC 6386 entire. Reserved bitstream versions and the reserved colour-space/clamping fields refused. The encoder writes version-0 key frames only, one independent picture per packet, through the image package\'s VP8 encoder at quality 75; it emits no inter-frame prediction | [RFC 6386](https://www.rfc-editor.org/rfc/rfc6386) |',
              'Encoding is a smaller domain than decoding on purpose: 46 codecs of the 100 read can also be written. Most are lossless; twelve are not, and each says so in its own row.':
                  'Encoding is a smaller domain than decoding on purpose: 47 codecs of the 100 read can also be written. Most are lossless; thirteen are not, and each says so in its own row.',
              "H.261's and Apple ProRes's quantised transforms, Hap's texture blocks and id RoQ's vector quantisation":
                  "H.261's, VP8's and Apple ProRes's quantised transforms, Hap's texture blocks and id RoQ's vector quantisation",
          }

          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one README occurrence of {old!r}, found {count}')
            text = text.replace(old, new)

          readme_path.write_text(text, encoding='utf-8')

          notes_path = Path('Hawkynt.FileFormats.Video/codec-notes.md')
          notes = notes_path.read_text(encoding='utf-8')
          marker = '### VP8\n\n'
          addition = (
              'The encoder is intentionally all-intra. Every input picture is written as a version-0 key frame '
              'at quality 75 through the image package\'s existing VP8 encoder, so packets carry no dependency on '
              'earlier reference frames. That spends compression ratio to keep the bitstream implementation in one '
              'place. The video adapter is separately exercised through the registry\'s FFmpeg oracle, which muxes '
              'three packets and asks FFmpeg to decode a frame back at the stated geometry.\n\n'
          )
          if addition not in notes:
            count = notes.count(marker)
            if count != 1:
              raise SystemExit(f'expected exactly one VP8 notes heading, found {count}')
            notes = notes.replace(marker, marker + addition)
            notes_path.write_text(notes, encoding='utf-8')

      - name: Generate package documentation
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: PNGCrushCS
          configuration: Release

      - name: Test
        working-directory: PNGCrushCS
        run: dotnet test PngCrush.slnx --configuration Release --no-build -p:EnableWindowsTargeting=true --filter "TestCategory!=Regression&TestCategory!=Performance"

      - name: Commit generated documentation
        shell: bash
        run: |
          cd PNGCrushCS
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Hawkynt"
          git config user.email "14230988+Hawkynt@users.noreply.github.com"
          git add -- '*README.md' '*REFERENCE.md' 'Hawkynt.FileFormats.Video/codec-notes.md'
          git commit -m "* document VP8 video encoding and regenerate reference"
          git push origin HEAD:${{ github.head_ref }}
