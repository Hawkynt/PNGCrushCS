name: Finalize HEVC completion patch

on:
  push:
    branches: [feat/h265-fractional-motion]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h265-fractional-motion
          fetch-depth: 0
      - name: Fix reference-buffer return and remove staging files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Hawkynt.FileFormats.Video/Codecs/H265/H265VideoSequenceEncoder.cs')
          content = path.read_text()
          old = '    return this._reference!;'
          new = '    return this._references[0].Picture;'
          if content.count(old) != 1:
            raise SystemExit(f'Expected exactly one stale reference return, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          git rm .github/hevc-completion.patch .github/workflows/apply-hevc-completion.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265VideoSequenceEncoder.cs
          git commit -m "Fix HEVC anchor reference and remove staging files"
          git push origin HEAD:feat/h265-fractional-motion
