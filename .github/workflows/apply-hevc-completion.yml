name: Apply HEVC completion patch

on:
  push:
    branches: [feat/h265-fractional-motion]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h265-fractional-motion
          fetch-depth: 0
      - name: Apply exact replacement patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/hevc-completion.patch').read_text().splitlines(keepends=True)
          i = 0
          changed = []
          while i < len(lines):
            if not lines[i].startswith('diff --git '):
              i += 1
              continue

            header = lines[i].rstrip('\n').split(' b/', 1)
            if len(header) != 2:
              raise SystemExit(f'Cannot parse diff header: {lines[i]!r}')
            path = header[1]
            i += 1
            section = []
            while i < len(lines) and not lines[i].startswith('diff --git '):
              section.append(lines[i])
              i += 1

            is_new = any(line.startswith('--- /dev/null') for line in section)
            hunks = []
            current = None
            for line in section:
              if line.startswith('@@'):
                if current is not None:
                  hunks.append(current)
                current = []
                continue
              if current is not None:
                current.append(line)
            if current is not None:
              hunks.append(current)

            target = Path(path)
            if is_new:
              if target.exists():
                raise SystemExit(f'New-file target already exists: {path}')
              content = ''.join(
                line[1:] for hunk in hunks for line in hunk
                if line.startswith('+') and not line.startswith('+++')
              )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
              changed.append(path)
              continue

            content = target.read_text()
            search_start = 0
            for hunk_number, hunk in enumerate(hunks, 1):
              old = ''.join(
                line[1:] for line in hunk
                if (line.startswith(' ') or line.startswith('-')) and not line.startswith('---')
              )
              new = ''.join(
                line[1:] for line in hunk
                if (line.startswith(' ') or line.startswith('+')) and not line.startswith('+++')
              )
              at = content.find(old, search_start)
              if at < 0:
                raise SystemExit(f'{path}: hunk {hunk_number} old block not found after offset {search_start}')
              content = content[:at] + new + content[at + len(old):]
              search_start = at + len(new)

            target.write_text(content)
            changed.append(path)

          if not changed:
            raise SystemExit('Patch changed no files')
          print('\n'.join(changed))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265PcmStillCodec.cs
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265FrameDecoder.cs
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265InterPictureEncoder.cs
          git add Hawkynt.FileFormats.Video/Codecs/H265/H265VideoSequenceEncoder.cs
          git add Tests/Hawkynt.FileFormats.Video.Tests/Codecs/H265/H265AdvancedInterEncoderTests.cs
          git add Tests/Hawkynt.FileFormats.Video.Tests/Codecs/H265/H265PcmFrameDecoderTests.cs
          git commit -m "Complete HEVC reference, partition, RD and PCM paths"
          git push origin HEAD:feat/h265-fractional-motion
