name: Temporary MS-MPEG-4 completion validation

on:
  push:
    branches: [complete/msmpeg4-p-intra]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Apply focused MS-MPEG-4 changes
        run: python .github/workflows/scripts/tmp-msmpeg4-p-intra.py

      - name: Check whitespace
        run: git diff --check

      - name: Restore video tests
        run: dotnet restore Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Run MS-MPEG-4 tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true --filter FullyQualifiedName~MsMpeg4 --logger "console;verbosity=detailed" 2>&1 | tee /tmp/msmpeg4-focused.log

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msmpeg4-focused-failure
          path: /tmp/msmpeg4-focused.log
          if-no-files-found: error

      - name: Run complete video test project
        run: dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Commit validated codec changes
        shell: bash
        run: |
          rm .github/workflows/tmp-msmpeg4-p-intra.yml .github/workflows/scripts/tmp-msmpeg4-p-intra.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "+ encode intra macroblocks in MS-MPEG-4 P pictures"
          git push origin HEAD:complete/msmpeg4-p-intra
