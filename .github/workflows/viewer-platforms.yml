name: Viewer platforms

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Crush.Viewer/**'
      - 'FileFormat.Core/**'
      - 'Hawkynt.FileFormats.Images/**'
      - 'Optimizers/Optimizer.Image/**'
      - '.github/workflows/viewer-platforms.yml'
  workflow_dispatch: {}

# Push only, deliberately. This used to trigger on pull_request as well, so once a branch had a
# pull request every commit ran the whole matrix TWICE on the same sha. Collapsing the pair with a
# shared concurrency group looked like the fix and was worse: the superseded run lands as a
# CANCELLED check on the head, GitHub rolls the head's checks up to FAILURE, and the merge box goes
# BLOCKED - even though none of these contexts is required and all of them passed. Not scheduling
# the duplicate is the fix; cancelling it only moves the cost.
concurrency:
  group: viewer-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  viewer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 1

      - name: Checkout CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build viewer
        working-directory: PNGCrushCS
        run: dotnet build Crush.Viewer/Crush.Viewer.csproj -c Debug --nologo -p:EnableSingleFileBundle=false

      - name: Smoke-test empty startup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: PNGCrushCS
        run: xvfb-run -a dotnet run --project Crush.Viewer/Crush.Viewer.csproj -c Debug --no-build --no-restore -p:EnableSingleFileBundle=false -- --smoke-test

      - name: Smoke-test empty startup (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: PNGCrushCS
        run: dotnet run --project Crush.Viewer/Crush.Viewer.csproj -c Debug --no-build --no-restore -p:EnableSingleFileBundle=false -- --smoke-test
