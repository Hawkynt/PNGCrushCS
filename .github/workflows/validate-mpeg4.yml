name: Validate MPEG-4 Part 2 writer

on:
  push:
    branches: [feature/mpeg4-part2-encoder]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x
      - name: Signal reordered VOPs as non-low-delay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4PictureEncoder.cs')
          text = path.read_text()
          old = '    this._writer.Write(0, 1);                              // vol_control_parameters\n'
          new = '''    this._writer.Write(1, 1);                              // vol_control_parameters\n    this._writer.Write(1, 2);                              // chroma_format: 4:2:0\n    this._writer.Write(0, 1);                              // low_delay: B-VOPs reorder pictures\n    this._writer.Write(0, 1);                              // vbv_parameters\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one VOL control-parameter field')
          path.write_text(text.replace(old, new))
          PY
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Decode the complete reordered I/P/B stream with FFmpeg
        shell: bash
        run: |
          set +e
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj \
            --configuration Release \
            -p:EnableWindowsTargeting=true \
            --filter "FullyQualifiedName~Mpeg4VideoEncoderTests.FFmpegReadsEveryReorderedPicture" \
            --logger "console;verbosity=minimal" > mpeg4-ffmpeg-test.log 2>&1
          status=$?
          tail -n 100 mpeg4-ffmpeg-test.log
          exit $status

  api-reference:
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x
      - name: Apply verified MPEG-4 VOL fix
        shell: pwsh
        run: |
          $path = 'Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4PictureEncoder.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = '    this._writer.Write(0, 1);                              // vol_control_parameters'
          $newline = [Environment]::NewLine
          $new = '    this._writer.Write(1, 1);                              // vol_control_parameters' + $newline +
                 '    this._writer.Write(1, 2);                              // chroma_format: 4:2:0' + $newline +
                 '    this._writer.Write(0, 1);                              // low_delay: B-VOPs reorder pictures' + $newline +
                 '    this._writer.Write(0, 1);                              // vbv_parameters'
          if (($text.Split($old).Count - 1) -ne 1) { throw 'expected exactly one VOL control-parameter field' }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - name: Build video package
        shell: pwsh
        run: |
          dotnet restore Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj -p:EnableWindowsTargeting=true
          dotnet build Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - name: Regenerate canonical package API reference
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: .
          project: Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj
      - name: Assert MPEG-4 encoder is documented
        shell: pwsh
        run: |
          if (-not (Select-String -Path Hawkynt.FileFormats.Video/REFERENCE.md -Pattern 'Mpeg4VideoEncoder' -Quiet)) {
            throw 'Mpeg4VideoEncoder is absent from the generated API reference.'
          }
      - name: Commit verified bitstream fix and generated documentation
        shell: pwsh
        run: |
          git config user.name "Hawkynt"
          git config user.email "14230988+Hawkynt@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4PictureEncoder.cs Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md
          git rm .github/workflows/validate-mpeg4.yml
          git commit -m "* finalize MPEG-4 Part 2 conformance and documentation"
          git push origin HEAD:feature/mpeg4-part2-encoder
