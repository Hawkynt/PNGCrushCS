name: VMnc FFmpeg oracle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oracle:
    if: github.head_ref == 'feature/vmnc-read-write' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: PNGCrushCS

      - name: Check out CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Install FFmpeg oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Run VMnc encoder oracle
        working-directory: PNGCrushCS
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj
          --configuration Release
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~EncoderOracleTests&Name~VMware"
          --logger "console;verbosity=normal"
