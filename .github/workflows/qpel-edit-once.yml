name: Apply qpel integration edits once

on:
  push:
    branches: [feature/mpeg4-part2-qpel]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mpeg4-part2-qpel
          fetch-depth: 0

      - name: Apply focused source edits
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text()
              text, n = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} replacement(s), got {n}")
              p.write_text(text)

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} exact occurrence(s), got {n}")
              p.write_text(text.replace(old, new, count))

          decoder = "Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4PictureDecoder.cs"
          replace(
              decoder,
              "    this._ReconstructPredicted(ref reader, address, pattern, vectorsX, vectorsY);",
              "    this._ReconstructPredicted(ref reader, address, pattern, vectorsX, vectorsY, vectorCount);")

          sub(
              decoder,
              r"  private void _ReconstructPredicted\(.*?\n  // ============================================================================================\n  // Bidirectionally coded pictures",
              '''  private void _ReconstructPredicted(
    ref Mpeg4BitReader reader, int address, int pattern, scoped ReadOnlySpan<int> vectorsX,
    scoped ReadOnlySpan<int> vectorsY, int vectorCount) {
    Span<int> block = stackalloc int[64];
    Span<int> prediction = stackalloc int[64];
    Span<int> quarterMacroblock = stackalloc int[16 * 16];

    // A one-vector qpel macroblock is one 16x16 interpolation operation. INTER4V is explicitly four
    // independent 8x8 operations, so it must not reuse this macroblock prediction even when all four
    // vectors happen to be equal: the internal 8x8 edges are mirrored only in the INTER4V case.
    var predictsOneQuarterMacroblock = this._layer.QuarterSample && vectorCount == 1;
    if (predictsOneQuarterMacroblock)
      this._PredictQuarterMacroblock(
        quarterMacroblock, this._forwardReference!, address, vectorsX[0], vectorsY[0], this._plane.RoundingType);

    var (chromaX, chromaY) = this._ChromaVector(vectorsX, vectorsY);
    for (var index = 0; index < 6; ++index) {
      if (index < 4 && predictsOneQuarterMacroblock) {
        _CopyQuarterSubBlock(prediction, quarterMacroblock, index);
      } else {
        var (vectorX, vectorY) = index < 4 ? (vectorsX[index], vectorsY[index]) : (chromaX, chromaY);
        this._Predict(
          prediction, this._forwardReference!, address, index, vectorX, vectorY, this._plane.RoundingType);
      }

      if (_IsCoded(pattern, index)) {
        Mpeg4BlockDecoder.ReadInter(ref reader, block, this._quantiser, this._layer);
        for (var i = 0; i < 64; ++i)
          block[i] += prediction[i];
      } else {
        prediction.CopyTo(block);
      }

      this._Store(address, index, block);
    }
  }

  // ============================================================================================
  // Bidirectionally coded pictures''')

          sub(
              decoder,
              r"  private void _ReconstructBidirectional\(.*?\n  // ============================================================================================\n  // Motion vectors",
              '''  private void _ReconstructBidirectional(
    ref Mpeg4BitReader reader, int address, int pattern,
    scoped Span<int> forwardX, scoped Span<int> forwardY, scoped Span<int> backwardX, scoped Span<int> backwardY,
    int type) {
    var usesForward = type is Mpeg4VlcTables.Forward or Mpeg4VlcTables.Interpolated or Mpeg4VlcTables.Direct;
    var usesBackward = type is Mpeg4VlcTables.Backward or Mpeg4VlcTables.Interpolated or Mpeg4VlcTables.Direct;
    var directUsesHalfSamples = type == Mpeg4VlcTables.Direct && this._layer.QuarterSample;
    var vectorIsQuarterSample = this._layer.QuarterSample && !directUsesHalfSamples;
    var predictsQuarterMacroblock = this._layer.QuarterSample && !directUsesHalfSamples;

    Span<int> block = stackalloc int[64];
    Span<int> prediction = stackalloc int[64];
    Span<int> backward = stackalloc int[64];
    Span<int> forwardQuarterMacroblock = stackalloc int[16 * 16];
    Span<int> backwardQuarterMacroblock = stackalloc int[16 * 16];

    var (chromaForwardX, chromaForwardY) = _ChromaVector(forwardX, forwardY, vectorIsQuarterSample);
    var (chromaBackwardX, chromaBackwardY) = _ChromaVector(backwardX, backwardY, vectorIsQuarterSample);

    // Ordinary B-VOP forward/backward/interpolated modes carry one vector for the macroblock and
    // therefore use one 16x16 qpel interpolation. Direct mode is different: in qpel VOLs its four
    // co-located vectors are first reduced to the half-pel grid, so it remains four half-pel 8x8
    // predictions and deliberately does not enter this path.
    if (predictsQuarterMacroblock) {
      if (usesForward)
        this._PredictQuarterMacroblock(
          forwardQuarterMacroblock, this._forwardReference!, address, forwardX[0], forwardY[0], 0);
      if (usesBackward)
        this._PredictQuarterMacroblock(
          backwardQuarterMacroblock, this._backwardReference!, address, backwardX[0], backwardY[0], 0);
    }

    for (var index = 0; index < 6; ++index) {
      var vectorBlock = index < 4 ? index : 0;

      if (index < 4 && predictsQuarterMacroblock) {
        if (usesForward)
          _CopyQuarterSubBlock(prediction, forwardQuarterMacroblock, index);
        if (usesBackward) {
          var target = usesForward ? backward : prediction;
          _CopyQuarterSubBlock(target, backwardQuarterMacroblock, index);
          if (usesForward)
            Mpeg4MotionCompensation.Average(prediction, backward);
        }
      } else {
        if (usesForward)
          this._Predict(
            prediction, this._forwardReference!, address, index,
            index < 4 ? forwardX[vectorBlock] : chromaForwardX,
            index < 4 ? forwardY[vectorBlock] : chromaForwardY, 0, directUsesHalfSamples);

        if (usesBackward) {
          var target = usesForward ? backward : prediction;
          this._Predict(
            target, this._backwardReference!, address, index,
            index < 4 ? backwardX[vectorBlock] : chromaBackwardX,
            index < 4 ? backwardY[vectorBlock] : chromaBackwardY, 0, directUsesHalfSamples);

          if (usesForward)
            Mpeg4MotionCompensation.Average(prediction, backward);
        }
      }

      if ((pattern & (1 << (5 - index))) != 0) {
        Mpeg4BlockDecoder.ReadInter(ref reader, block, this._quantiser, this._layer);
        for (var i = 0; i < 64; ++i)
          block[i] += prediction[i];
      } else {
        prediction.CopyTo(block);
      }

      this._Store(address, index, block);
    }
  }

  // ============================================================================================
  // Motion vectors''')

          replace(
              decoder,
              '''  private void _Predict(
    Span<int> prediction, Mpeg4Frame reference, int address, int index, int vectorX, int vectorY, int rounding,
    bool forceHalfSample = false) {''',
              '''  private void _PredictQuarterMacroblock(
    Span<int> prediction, Mpeg4Frame reference, int address, int vectorX, int vectorY, int rounding) {
    var (plane, stride, origin, width, height) = reference.PlaneOf(0);
    var left = address % this._macroblockWidth * 16;
    var top = address / this._macroblockWidth * 16;
    Mpeg4QuarterSample.Predict(
      prediction, plane, stride, origin, width, height, left, top, 16, vectorX, vectorY, rounding);
  }

  private static void _CopyQuarterSubBlock(
    Span<int> destination, scoped ReadOnlySpan<int> macroblock, int block) {
    var left = (block & 1) * 8;
    var top = (block >> 1) * 8;
    for (var y = 0; y < 8; ++y)
      macroblock.Slice((top + y) * 16 + left, 8).CopyTo(destination.Slice(y * 8, 8));
  }

  private void _Predict(
    Span<int> prediction, Mpeg4Frame reference, int address, int index, int vectorX, int vectorY, int rounding,
    bool forceHalfSample = false) {''')

          encoder = "Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4PictureEncoder.cs"
          replace(
              encoder,
              '''  /// <summary>How far a motion search looks, in whole samples, around the predicted vector.</summary>
  /// <remarks>
  /// vop_fcode_forward is one here, so 7.6.3 gives a vector the range [-32, 31] half-samples, which
  /// is [-16, 15.5] whole ones. Fifteen keeps every candidate inside that: the range is not merely
  /// what a vector costs to state but what it means, because a vector outside it is wrapped by a
  /// whole range on the way back and returns as a different vector.
  /// </remarks>
  private const int _SEARCH_RANGE = 15;

  /// <summary>The half-sample range vop_fcode_forward 1 permits.</summary>''',
              '''  /// <summary>How far the integer stage of the qpel motion search looks, in whole samples.</summary>
  /// <remarks>
  /// With quarter_sample and f_code one the coded component range [-32,31] is measured in quarter
  /// samples, so the integer stage may safely reach seven whole samples each way. The refinement
  /// below then uses the remaining three quarter positions and can reach the exact coded endpoints.
  /// </remarks>
  private const int _SEARCH_RANGE = 7;

  /// <summary>The quarter-sample component range vop_fcode_forward 1 permits.</summary>''')

          sub(
              encoder,
              r"  private void _WriteVideoObjectLayer\(\) \{.*?\n  private void _WriteVideoObjectPlane\(\)",
              '''  private void _WriteVideoObjectLayer() {
    this._StartCode(Mpeg4StartCode.FirstVideoObjectLayer);
    this._writer.Write(0, 1);                              // random_accessible_vol
    this._writer.Write(17, 8);                             // Advanced Simple visual object type
    this._writer.Write(1, 1);                              // is_object_layer_identifier
    this._writer.Write(2, 4);                              // verid 2: quarter_sample syntax is present
    this._writer.Write(1, 3);                              // video_object_layer_priority
    this._writer.Write(1, 4);                              // aspect_ratio_info: square pixels
    // vol_control_parameters carries low_delay, and low_delay is the difference between a stream that
    // reorders pictures and one that promises never to. This encoder carries B-VOPs, so low_delay is
    // explicitly clear rather than left at the default a decoder would otherwise infer.
    this._writer.Write(1, 1);                              // vol_control_parameters
    this._writer.Write(1, 2);                              // chroma_format: 4:2:0
    this._writer.Write(0, 1);                              // low_delay: pictures are reordered
    this._writer.Write(0, 1);                              // vbv_parameters: none
    this._writer.Write(0, 2);                              // video_object_layer_shape: rectangular
    this._writer.Write(1, 1);                              // marker_bit
    this._writer.Write(this._timeIncrementResolution, 16);
    this._writer.Write(1, 1);                              // marker_bit
    this._writer.Write(0, 1);                              // fixed_vop_rate
    this._writer.Write(1, 1);                              // marker_bit
    this._writer.Write(this._width, 13);
    this._writer.Write(1, 1);                              // marker_bit
    this._writer.Write(this._height, 13);
    this._writer.Write(1, 1);                              // marker_bit
    this._writer.Write(0, 1);                              // interlaced
    this._writer.Write(1, 1);                              // obmc_disable
    this._writer.Write(0, 2);                              // sprite_enable, verid 2
    this._writer.Write(0, 1);                              // not_8_bit
    this._writer.Write(0, 1);                              // quant_type: H.263
    this._writer.Write(1, 1);                              // quarter_sample
    this._writer.Write(1, 1);                              // complexity_estimation_disable
    this._writer.Write(1, 1);                              // resync_marker_disable
    this._writer.Write(0, 1);                              // data_partitioned
    this._writer.Write(0, 1);                              // newpred_enable
    this._writer.Write(0, 1);                              // reduced_resolution_vop_enable
    this._writer.Write(0, 1);                              // scalability
    this._NextStartCode();
  }

  private void _WriteVideoObjectPlane()''')

          replace(
              encoder,
              "    var (vectorX, vectorY) = this._SearchMotion(this._forwardReference!, address);",
              "    var (vectorX, vectorY) = this._SearchMotion(this._forwardReference!, address, this._roundingType);")
          replace(
              encoder,
              "    var forward = this._SearchMotion(this._forwardReference!, address);\n    var backward = this._SearchMotion(this._backwardReference!, address);",
              "    var forward = this._SearchMotion(this._forwardReference!, address, rounding: 0);\n    var backward = this._SearchMotion(this._backwardReference!, address, rounding: 0);")

          sub(
              encoder,
              r"  private \(int X, int Y\) _SearchMotion\(.*?\n  /// <summary>Writes one vector component's difference",
              '''  private (int X, int Y) _SearchMotion(Mpeg4Frame reference, int address, int rounding) {
    var (plane, stride, origin, width, height) = reference.PlaneOf(0);
    var (sourcePlane, sourceStride, sourceOrigin, _, _) = this._source.PlaneOf(0);
    var left = address % this._macroblockWidth * 16;
    var top = address / this._macroblockWidth * 16;

    // Keep zero as the incumbent and displace it only for a strictly better prediction. That tie
    // policy is what lets still/repeating content become not_coded instead of acquiring arbitrary
    // motion merely because a different candidate was visited first.
    var best = (X: 0, Y: 0);
    var bestCost = _QuarterSampleCost(
      sourcePlane, sourceStride, sourceOrigin, plane, stride, origin, width, height,
      left, top, 0, 0, rounding, int.MaxValue);

    // Coarse integer-pel stage. Whole samples are multiples of four in qpel units.
    for (var candidateY = -_SEARCH_RANGE; candidateY <= _SEARCH_RANGE; ++candidateY)
    for (var candidateX = -_SEARCH_RANGE; candidateX <= _SEARCH_RANGE; ++candidateX) {
      var cost = _IntegerCost(sourcePlane, sourceStride, sourceOrigin, plane, stride, origin,
        left, top, candidateX, candidateY, bestCost);
      if (cost >= bestCost)
        continue;

      bestCost = cost;
      best = (4 * candidateX, 4 * candidateY);
    }

    // Refine the winning integer location on the quarter-pel grid. ±3 reaches every fractional
    // position around it; the component bounds keep f_code=1's modulo reconstruction unambiguous.
    var integerBest = best;
    for (var deltaY = -3; deltaY <= 3; ++deltaY)
    for (var deltaX = -3; deltaX <= 3; ++deltaX) {
      var vectorX = integerBest.X + deltaX;
      var vectorY = integerBest.Y + deltaY;
      if (vectorX is < _VECTOR_LOW or > _VECTOR_HIGH || vectorY is < _VECTOR_LOW or > _VECTOR_HIGH)
        continue;
      if (vectorX == best.X && vectorY == best.Y)
        continue;

      var cost = _QuarterSampleCost(
        sourcePlane, sourceStride, sourceOrigin, plane, stride, origin, width, height,
        left, top, vectorX, vectorY, rounding, bestCost);
      if (cost >= bestCost)
        continue;

      bestCost = cost;
      best = (vectorX, vectorY);
    }

    return best;
  }

  private static int _IntegerCost(
    byte[] sourcePlane, int sourceStride, int sourceOrigin,
    byte[] plane, int stride, int origin,
    int left, int top, int vectorX, int vectorY, int ceiling) {
    var cost = 0;
    for (var y = 0; y < 16 && cost < ceiling; ++y) {
      var sourceRow = sourceOrigin + (top + y) * sourceStride + left;
      var referenceRow = origin + (top + y + vectorY) * stride + left + vectorX;
      for (var x = 0; x < 16; ++x)
        cost += Math.Abs(sourcePlane[sourceRow + x] - plane[referenceRow + x]);
    }

    return cost;
  }

  private static int _QuarterSampleCost(
    byte[] sourcePlane, int sourceStride, int sourceOrigin,
    byte[] plane, int stride, int origin, int width, int height,
    int left, int top, int vectorX, int vectorY, int rounding, int ceiling) {
    Span<int> prediction = stackalloc int[16 * 16];
    Mpeg4QuarterSample.Predict(
      prediction, plane, stride, origin, width, height, left, top, 16, vectorX, vectorY, rounding);

    var cost = 0;
    for (var y = 0; y < 16 && cost < ceiling; ++y) {
      var sourceRow = sourceOrigin + (top + y) * sourceStride + left;
      for (var x = 0; x < 16; ++x)
        cost += Math.Abs(sourcePlane[sourceRow + x] - prediction[y * 16 + x]);
    }

    return cost;
  }

  /// <summary>Writes one vector component's difference''')

          sub(
              encoder,
              r"  private void _PredictFrom\(.*?\n  private void _PredictZero\(",
              '''  private void _PredictFrom(
    Span<int> prediction, Mpeg4Frame reference, int address, int block, int vectorX, int vectorY, int rounding) {
    var (plane, stride, origin, width, height) = reference.PlaneOf(block);
    var (left, top) = this._BlockOrigin(address, block);

    if (block < 4) {
      // The encoder emits one vector per macroblock, so qpel luma is one normative 16x16 operation,
      // not four 8x8 operations. Extract the requested transform block only after interpolation.
      Span<int> macroblock = stackalloc int[16 * 16];
      var macroblockLeft = address % this._macroblockWidth * 16;
      var macroblockTop = address / this._macroblockWidth * 16;
      Mpeg4QuarterSample.Predict(
        macroblock, plane, stride, origin, width, height,
        macroblockLeft, macroblockTop, 16, vectorX, vectorY, rounding);

      var sourceLeft = (block & 1) * 8;
      var sourceTop = (block >> 1) * 8;
      for (var y = 0; y < 8; ++y)
        macroblock.Slice((sourceTop + y) * 16 + sourceLeft, 8).CopyTo(prediction.Slice(y * 8, 8));
      return;
    }

    // Chroma remains half-sample motion compensation. In qpel mode §7.6.5 first halves every one
    // of the four repeated luma vectors before summation, then applies the ordinary reduction table.
    var blockVectorX = Mpeg4QuarterSample.ToChroma(vectorX, vectorX, vectorX, vectorX);
    var blockVectorY = Mpeg4QuarterSample.ToChroma(vectorY, vectorY, vectorY, vectorY);
    Mpeg4MotionCompensation.PredictHalfSample(
      prediction, plane, stride, origin, Mpeg4Frame.Border / 2, width, height, left, top,
      blockVectorX, blockVectorY, rounding);
  }

  private void _PredictZero(''')

          anchor = "Hawkynt.FileFormats.Video/Codecs/Mpeg4/Mpeg4AnchorMotion.cs"
          replace(
              anchor,
              '''  /// <summary>Each macroblock's four horizontal vectors, in half-sample units.</summary>
  /// <remarks>
  /// Half-sample units even for a quarter-sample picture. The direct mode derivation of 7.6.7 is
  /// stated over the anchor's vectors at the resolution the anchor coded them, and a picture and its
  /// anchor may not use the same resolution; keeping one unit here means the scaling is one
  /// arithmetic and not two.
  /// </remarks>''',
              '''  /// <summary>Each macroblock's four horizontal vectors, in the active VOL's motion-vector units.</summary>
  /// <remarks>
  /// They are half-sample units in an ordinary VOL and quarter-sample units when
  /// <c>quarter_sample</c> is set. Direct-mode B-VOP reconstruction performs the normative qpel to
  /// half-pel conversion before temporal scaling; keeping the anchor values exactly as coded avoids
  /// losing the quarter-sample information needed by non-direct prediction and conformance checks.
  /// </remarks>''')

          Path(".github/workflows/qpel-edit-once.yml").unlink()

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit source edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate MPEG-4 quarter-sample prediction and encoding"
          git push origin HEAD:feature/mpeg4-part2-qpel
