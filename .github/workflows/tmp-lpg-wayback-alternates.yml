name: Temporary LPG archive alternate probe

on:
  push:
    branches:
      - research/lpg-paris-oracle

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe archive availability and indexes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lpg-archive-alt
          mkdir -p /tmp/lpg-archive-alt
          python3 - <<'PY'
          from __future__ import annotations

          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          out = pathlib.Path('/tmp/lpg-archive-alt')
          headers = {'User-Agent': 'Mozilla/5.0 LPG-format-research'}
          hosts = [
              'http://ftp.XLPrintau.dynip.com/',
              'http://XLPrintau.dynip.com/',
              'http://www.xlprint.com/',
              'http://xlprint.com/',
          ]
          paths = [
              'setup.exe', 'Setup.exe', 'paris.exe', 'Paris.exe',
              'readme.txt', 'README.TXT', 'download/', 'downloads/',
              'pub/', 'Paris/', 'paris/',
          ]

          requests: list[tuple[str, str]] = []
          for index, host in enumerate(hosts):
              requests.extend([
                  (f'availability_{index}', 'https://archive.org/wayback/available?' + urllib.parse.urlencode({'url': host, 'timestamp': '20010201'})),
                  (f'arquivo_cdx_{index}', 'https://arquivo.pt/wayback/cdx?' + urllib.parse.urlencode({'url': host + '*', 'output': 'json', 'limit': '10000'})),
                  (f'memento_{index}', 'https://timetravel.mementoweb.org/api/json/20010201/' + host),
              ])
              requests.extend(
                  (f'exact_{index}_{path_index}', 'https://archive.org/wayback/available?' + urllib.parse.urlencode({'url': host + path, 'timestamp': '20010201'}))
                  for path_index, path in enumerate(paths)
              )

          def probe(label: str, url: str) -> tuple[str, str]:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=8) as response:
                      body = response.read()
                      meta = {
                          'request': url,
                          'status': response.status,
                          'final': response.geturl(),
                          'content_type': response.headers.get('content-type', ''),
                          'length': len(body),
                      }
                      (out / f'{label}.body').write_bytes(body)
                      (out / f'{label}.meta.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
                      return label, f"{response.status} {len(body)} {response.geturl()}\n{body.decode('utf-8', 'replace')[:12000]}"
              except Exception as exc:
                  text = f'{type(exc).__name__}: {exc}'
                  (out / f'{label}.error.txt').write_text(text, encoding='utf-8')
                  return label, text

          with ThreadPoolExecutor(max_workers=16) as executor:
              futures = [executor.submit(probe, label, url) for label, url in requests]
              for future in as_completed(futures):
                  label, text = future.result()
                  print(f'\n=== {label} ===\n{text}')
          PY
      - name: Upload responses
        uses: actions/upload-artifact@v4
        with:
          name: lpg-archive-alternate-probe
          path: /tmp/lpg-archive-alt
          if-no-files-found: error
