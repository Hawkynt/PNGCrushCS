name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect preserved Canvas ImageGear media
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"

          ISO_URL='https://archive.org/download/canvas-702-windows-1999/Canvas-702-Windows-1999.iso'
          echo '=== download preserved Canvas 7.0.2 Windows CD ==='
          curl -fL --retry 3 --retry-delay 2 -o canvas7.iso "$ISO_URL"
          ls -lh canvas7.iso
          md5sum canvas7.iso
          test "$(md5sum canvas7.iso | cut -d' ' -f1)" = 'b6ed40364f717a4909f99e3b58ca8ee0'

          command -v 7z >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
          echo '=== relevant CD paths ==='
          7z l -ba canvas7.iso > files.txt
          grep -iE 'gear32|imagegear|accusoft|\.igf([[:space:]]|$)|accucnst|gear\.h|ig7([[:space:]]|$)' files.txt | head -1000 || true

          echo '=== all DLLs with gear-like names ==='
          grep -iE '\.dll([[:space:]]|$)' files.txt | grep -iE 'gear|accu|image|fpx' | head -500 || true

          echo '=== extract all candidate ImageGear files ==='
          mkdir extracted
          7z e -y -oextracted canvas7.iso -r \
            -i'!*GEAR32*.DLL' -i'!*IGFPX*.DLL' -i'!*ACCUCNST*' -i'!*GEAR.H' -i'!*.IGF' -i'!*.IG7' >/dev/null || true
          find extracted -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | head -1000
          for f in extracted/*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            file "$f" || true
            sha256sum "$f" || true
            if file "$f" | grep -q 'PE32'; then
              strings -a "$f" | grep -iE 'IGF|ImageGear Format|\.igf|\.lpg|LPG|Xerox|ATT|BRK|GX2|ICA|IMT|KFX|diskfile\.ig' | head -500 || true
            else
              head -c 256 "$f" | xxd -g1 || true
            fi
          done
