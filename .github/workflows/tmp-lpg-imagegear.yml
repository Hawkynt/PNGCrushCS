name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Narrow ImageGear oracle probe
        shell: bash
        run: |
          set -u
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"

          echo '=== Internet Archive focused search ==='
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = [
              'title:(ImageGear) AND (creator:(AccuSoft) OR description:(AccuSoft))',
              'title:(OfficeGear) AND (creator:(AccuSoft) OR description:(AccuSoft))',
              'gear32sd.dll',
              '"Canvas 7" AND Deneba',
              '"Paris" AND XLPrint',
          ]
          for q in queries:
              print('\n---', q, '---')
              u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({
                  'q':q,'fl[]':['identifier','title','creator','year'],'rows':50,'page':1,'output':'json'
              }, doseq=True)
              try:
                  with urllib.request.urlopen(u, timeout=20) as r:
                      data=json.load(r)
                  print('numFound', data['response'].get('numFound'))
                  for d in data['response']['docs']:
                      print(d.get('identifier',''), '|', d.get('title',''), '|', d.get('creator',''), '|', d.get('year',''))
              except Exception as e:
                  print(type(e).__name__, e)
          PY

          echo '=== Direct DLL download-page inspection ==='
          for url in \
            'https://www.opendll.com/index.php?arch=32bit&file-download=gear32sd.dll&version=7.0.15.15' \
            'https://www.dll-files.com/gear32sd.dll.html'; do
            echo "--- $url ---"
            html="$ROOT/page.html"
            curl --max-time 20 -A 'Mozilla/5.0' -fsSL "$url" -o "$html" || { echo FETCH_FAILED; continue; }
            grep -inE -B3 -A5 'gear32sd|download|\.zip|\.dll' "$html" | head -250 || true
            echo '--- href/action candidates ---'
            grep -oiE '(href|action)=["'"'][^"'"']+["'"']' "$html" | grep -iE 'download|gear32|\.zip|\.dll' | head -100 || true
          done

          echo '=== Wayback exact legacy file candidates ==='
          for target in \
            'www.accusoft.com/*ImageGear*.zip' \
            'www.accusoft.com/*ImageGear*.exe' \
            'www.accusoft.com/*OfficeGear*.zip' \
            'www.accusoft.com/*OfficeGear*.exe' \
            'ftp.accusoft.com/*.zip' \
            'ftp.accusoft.com/*.exe' \
            'ftp.xlprintau.dynip.com/*.zip' \
            'ftp.xlprintau.dynip.com/*.exe'; do
            echo "--- $target ---"
            curl --max-time 25 -fsSLG 'https://web.archive.org/cdx/search/cdx' \
              --data-urlencode "url=$target" \
              --data-urlencode 'output=json' \
              --data-urlencode 'fl=timestamp,original,statuscode,mimetype,digest,length' \
              --data-urlencode 'filter=statuscode:200' \
              --data-urlencode 'collapse=urlkey' \
              --data-urlencode 'limit=1000' || true
            echo
          done
