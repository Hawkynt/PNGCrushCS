name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Execute ImageGear 7 header oracle
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          echo '=== dependencies ==='
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 wine32:i386 wine

          echo '=== recover verified ImageGear 7.0.15 DLL ==='
          curl -A "$UA" -fsSL 'https://www.dll-files.com/gear32sd.dll.html' -o index.html
          rel=$(grep -oE '/download/[A-Za-z0-9]+/gear32sd\.dll\.html\?c=[A-Za-z0-9=]+' index.html | head -1)
          curl -A "$UA" -fsSL "https://www.dll-files.com$rel" -o landing.html
          zipurl=$(python3 - <<'PY'
          import html,re
          s=open('landing.html',encoding='utf-8').read()
          m=re.search(r'https://download\.zip\.dll-files\.com/[^"<]+gear32sd\.zip\?token=[^"<&]+(?:&amp;|&)expires=[0-9]+',s)
          if not m: raise SystemExit(2)
          print(html.unescape(m.group(0)))
          PY
          )
          curl -A "$UA" -fL "$zipurl" -o gear.zip
          unzip -qo gear.zip -d dll
          cp "$(find dll -type f -iname 'gear32sd.dll' -print -quit)" GEAR32SD.DLL
          test "$(sha256sum GEAR32SD.DLL | cut -d' ' -f1)" = 'a42787bc5c747f306169b28d5d0e7b71c16ad48a4bc11b2b434117d349e130c2'

          echo '=== test images ==='
          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          white=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 01 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 53 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 1c 35')
          black=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 02 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 54 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 35 40 35')
          Path('white.bin').write_bytes(white)
          Path('black.bin').write_bytes(black)
          Path('white.igf').write_bytes(white)
          Path('white.lpg').write_bytes(white)
          # 1x1 24bpp BMP
          row=b'\x00\x00\xff\x00'
          bmp=b'BM'+struct.pack('<IHHI',54+len(row),0,0,54)+struct.pack('<IIIHHIIIIII',40,1,1,1,24,0,len(row),2835,2835,0,0)+row
          Path('known.bmp').write_bytes(bmp)
          # 1x1 binary PPM
          Path('known.ppm').write_bytes(b'P6\n1 1\n255\n\xff\x00\x00')
          # minimal PNG
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1,1,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b'\x00\xff\x00\x00'))+chunk(b'IEND',b'')
          Path('known.png').write_bytes(png)
          PY

          echo '=== compile dynamic ABI probe ==='
          cat > probe.c <<'C'
          #include <windows.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          typedef int (__cdecl *fn_init)(void *);
          typedef int (__cdecl *fn_close)(void *);
          typedef int (__cdecl *fn_info)(const char *, uint32_t *, uint32_t *, void *);
          typedef int (__cdecl *fn_load)(const char *, uint32_t *);
          typedef int (__cdecl *fn_dims)(uint32_t, uint32_t *, uint32_t *, void *);
          typedef int (__cdecl *fn_save)(uint32_t, const char *, uint32_t);
          typedef int (__cdecl *fn_delete)(uint32_t);

          int main(int argc, char **argv) {
            HMODULE m=LoadLibraryA("GEAR32SD.DLL");
            if(!m){printf("LoadLibrary failed %lu\n",GetLastError()); return 2;}
            fn_init init=(fn_init)GetProcAddress(m,"IG_initialize");
            fn_close closeig=(fn_close)GetProcAddress(m,"IG_close");
            fn_info info=(fn_info)GetProcAddress(m,"IG_info_get");
            fn_load load=(fn_load)GetProcAddress(m,"IG_load_file");
            fn_dims dims=(fn_dims)GetProcAddress(m,"IG_image_dimensions_get");
            fn_save save=(fn_save)GetProcAddress(m,"IG_save_file");
            fn_delete del=(fn_delete)GetProcAddress(m,"IG_image_delete");
            printf("exports init=%p close=%p info=%p load=%p dims=%p save=%p delete=%p\n",init,closeig,info,load,dims,save,del);
            if(!init||!info||!load){return 3;}
            int rc=init(NULL); printf("IG_initialize rc=%d\n",rc);
            for(int i=1;i<argc;i++){
              uint32_t fmt=0xdeadbeef, comp=0xcafebabe;
              unsigned char dib[1024]; memset(dib,0xcc,sizeof(dib));
              rc=info(argv[i],&fmt,&comp,dib);
              printf("INFO %-12s rc=%d fmt=%u(0x%08x) comp=%u(0x%08x) dib0=",argv[i],rc,fmt,fmt,comp,comp);
              for(int j=0;j<40;j++)printf("%02x",dib[j]); puts("");
              uint32_t h=0;
              rc=load(argv[i],&h);
              printf("LOAD %-12s rc=%d handle=0x%08x",argv[i],rc,h);
              if(rc==0 && h){
                uint32_t w=0,hh=0,bpp=0;
                if(dims){int dr=dims(h,&w,&hh,&bpp); printf(" dims_rc=%d %ux%u bpp=%u",dr,w,hh,bpp);}
                char out[128]; snprintf(out,sizeof(out),"%s.out.bmp",argv[i]);
                if(save){int sr=save(h,out,0); printf(" save_unknown_bmp_rc=%d",sr);}
                if(del)del(h);
              }
              puts("");
            }
            if(closeig) printf("IG_close rc=%d\n",closeig(NULL));
            return 0;
          }
          C
          i686-w64-mingw32-gcc -O2 -Wall probe.c -o probe.exe
          file probe.exe

          echo '=== run ImageGear oracle ==='
          export WINEDEBUG=-all
          wineboot -u >/dev/null 2>&1 || true
          wine ./probe.exe known.bmp known.ppm known.png white.bin black.bin white.igf white.lpg || true

          echo '=== converted outputs ==='
          find . -maxdepth 1 -name '*.out.bmp' -printf '%f %s bytes\n' -exec file {} \; -exec xxd -g1 -l 80 {} \; || true
