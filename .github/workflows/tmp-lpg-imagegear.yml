name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Follow ImageGear download and archive paths
        shell: bash
        run: |
          set -u
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          inspect_candidate() {
            local f="$1"
            [ -f "$f" ] || return 0
            echo "--- candidate $f ---"
            ls -l "$f" || true
            file "$f" || true
            sha256sum "$f" || true
            head -c 32 "$f" | xxd -g1 || true
            unzip -l "$f" 2>/dev/null | head -80 || true
          }

          echo '=== OpenDLL cookie/token flow ==='
          curl -A "$UA" -c od.cookies -b od.cookies -fsSL \
            'https://www.opendll.com/index.php?arch=32bit&file-download=gear32sd.dll&version=7.0.15.15' -o od.html || true
          token=$(grep -oE 'download\.php\?token=[0-9]+' od.html | head -1 || true)
          echo "TOKEN=$token"
          if [ -n "$token" ]; then
            curl -A "$UA" -e 'https://www.opendll.com/index.php?arch=32bit&file-download=gear32sd.dll&version=7.0.15.15' \
              -c od.cookies -b od.cookies -D od.headers -fL --max-time 30 \
              -o od.download "https://www.opendll.com/$token" || true
            cat od.headers || true
            inspect_candidate od.download
          fi

          echo '=== DLL-files cookie/landing flow ==='
          curl -A "$UA" -c df.cookies -b df.cookies -fsSL 'https://www.dll-files.com/gear32sd.dll.html' -o df.index || true
          rel=$(grep -oE '/download/[A-Za-z0-9]+/gear32sd\.dll\.html\?c=[A-Za-z0-9=]+' df.index | head -1 || true)
          echo "LANDING=$rel"
          if [ -n "$rel" ]; then
            curl -A "$UA" -e 'https://www.dll-files.com/gear32sd.dll.html' -c df.cookies -b df.cookies \
              -D df.landing.headers -fL --max-time 30 -o df.landing "https://www.dll-files.com$rel" || true
            cat df.landing.headers || true
            inspect_candidate df.landing
            echo '--- landing interesting lines ---'
            grep -inE -B3 -A5 'download|\.zip|gear32|href=|action=|location|window\.' df.landing | tail -300 || true
          fi

          echo '=== Internet Archive item metadata: Canvas and Chip ==='
          python3 - <<'PY'
          import json, urllib.request
          for ident in ['canvas-702-windows-1999','canvas-6-trial','02cnvart1','czchip199908cd']:
              print('\n---', ident, '---')
              try:
                  with urllib.request.urlopen('https://archive.org/metadata/'+ident, timeout=30) as r:
                      md=json.load(r)
              except Exception as e:
                  print(type(e).__name__, e); continue
              files=md.get('files',[])
              for f in files:
                  name=f.get('name','')
                  size=int(f.get('size') or 0)
                  if name.lower().endswith(('.iso','.zip','.7z','.rar','.exe','.img','.bin','.cue')) or any(x in name.lower() for x in ('gear','imagegear','igf')):
                      print('FILE', size, name, f.get('md5',''))
          PY
