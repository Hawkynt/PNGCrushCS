name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack preserved ImageGear-era installers
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unshield

          echo '=== Chip 1999-08 generated file index ==='
          curl -fL --retry 3 -o chip-index.zip \
            'https://archive.org/download/czchip199908cd/Chip_1999-08_cd_dic-files.zip'
          unzip -l chip-index.zip | head -80
          mkdir chip-index
          unzip -q chip-index.zip -d chip-index
          echo '--- ImageGear/AccuSoft candidates in generated index ---'
          grep -RIniE 'imagegear|accusoft|gear32sd|gear32|officegear|\.igf([[:space:]"<>]|$)' chip-index | head -500 || true
          echo '--- candidate filenames ---'
          find chip-index -type f -printf '%p\n' | grep -iE 'imagegear|accusoft|gear32|officegear|igf' | head -500 || true

          echo '=== Canvas 7 installer containers ==='
          curl -fL --retry 3 -o canvas7.iso \
            'https://archive.org/download/canvas-702-windows-1999/Canvas-702-Windows-1999.iso'
          7z l -ba canvas7.iso > canvas-list.txt
          grep -iE '\.(cab|hdr|exe|zip|dll)([[:space:]]|$)' canvas-list.txt | head -1000 || true

          mkdir canvas
          7z x -y -ocanvas canvas7.iso -r \
            -i'!*.cab' -i'!*.hdr' -i'!setup*.exe' -i'!_setup.dll' -i'!data*.bin' >/dev/null || true
          echo '--- extracted installer files ---'
          find canvas -type f -printf '%p %s\n' | head -1000

          echo '--- inspect InstallShield cabinets ---'
          while IFS= read -r cab; do
            dir=$(dirname "$cab")
            echo "CAB=$cab"
            (cd "$dir" && unshield l "$(basename "$cab")" 2>&1 | grep -iE 'gear32|imagegear|accusoft|\.igf$|accucnst|gear\.h|ig7|fpx' | head -500) || true
            7z l -ba "$cab" 2>/dev/null | grep -iE 'gear32|imagegear|accusoft|\.igf([[:space:]]|$)|accucnst|gear\.h|ig7|fpx' | head -500 || true
          done < <(find canvas -type f -iname '*.cab')

          echo '--- raw strings across setup payloads ---'
          find canvas -type f -print0 | xargs -0 strings -a 2>/dev/null \
            | grep -iE 'GEAR32SD\.DLL|ImageGear|AccuSoft|ImageGear Format|IG_SAVE_IGF|IG_FORMAT_IGF|\.IGF([^A-Za-z]|$)|diskfile\.ig' \
            | head -1000 || true
