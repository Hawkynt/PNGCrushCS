name: Temporary LPG ImageGear research

on:
  push:
    branches: [research/lpg-imagegear]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ImageGear initialization and retired filters
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/ig
          mkdir -p "$ROOT"
          cd "$ROOT"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          echo '=== ImageGear 7.0.15 ==='
          curl -A "$UA" -fsSL 'https://www.dll-files.com/gear32sd.dll.html' -o index.html
          rel=$(grep -oE '/download/[A-Za-z0-9]+/gear32sd\.dll\.html\?c=[A-Za-z0-9=]+' index.html | head -1)
          curl -A "$UA" -fsSL "https://www.dll-files.com$rel" -o landing.html
          zipurl=$(python3 - <<'PY'
          import html,re
          s=open('landing.html',encoding='utf-8').read()
          m=re.search(r'https://download\.zip\.dll-files\.com/[^"<]+gear32sd\.zip\?token=[^"<&]+(?:&amp;|&)expires=[0-9]+',s)
          print(html.unescape(m.group(0)))
          PY
          )
          curl -A "$UA" -fL "$zipurl" -o gear.zip
          unzip -qo gear.zip -d g7
          cp "$(find g7 -type f -iname 'gear32sd.dll' -print -quit)" GEAR7.DLL
          test "$(sha256sum GEAR7.DLL | cut -d' ' -f1)" = 'a42787bc5c747f306169b28d5d0e7b71c16ad48a4bc11b2b434117d349e130c2'
          echo '--- init/close/error exports ---'
          objdump -p GEAR7.DLL | grep -iE 'IG_.*(init|close|start|term|error|license|info_get|load_file)' | head -300 || true

          echo '=== ImageGear bundled with Canvas 7.0.2 (1998 DLL) ==='
          curl -fL --retry 3 -o canvas7.iso 'https://archive.org/download/canvas-702-windows-1999/Canvas-702-Windows-1999.iso'
          mkdir cab
          7z e -y -ocab canvas7.iso Canvas7/DefaultProgram.Cab >/dev/null
          mkdir old
          7z x -y -oold cab/DefaultProgram.Cab >/dev/null
          OLD=$(find old -type f -iname '*GEAR32SD.DLL' -print -quit)
          echo "OLD=$OLD"
          file "$OLD"
          sha256sum "$OLD"
          echo '--- version strings ---'
          strings -el "$OLD" | grep -iE 'ImageGear|AccuSoft|Version|Copyright' | head -100 || true
          echo '--- init/close/error exports ---'
          objdump -p "$OLD" | grep -iE 'IG_.*(init|close|start|term|error|license|info_get|load_file)' | head -300 || true
          echo '--- retired IGF/LPG strings ---'
          strings -a "$OLD" | grep -iE '(^|[^A-Za-z])(IGF|LPG|ImageGear Format)([^A-Za-z]|$)|IGFREAD|IGFWRITE|\.IGF([^A-Za-z]|$)|\.LPG([^A-Za-z]|$)' | head -500 || true
          echo '--- ImageGear source filter modules ---'
          strings -a "$OLD" | grep -oEi 'FILTERS\\[A-Z0-9_]+\.(C|CPP)' | sort -fu | head -1000 || true
          echo '--- format-like extension strings ---'
          strings -a "$OLD" | grep -E '^\*?\.[A-Za-z0-9]{2,5}$|^[A-Z0-9]{2,6} File$|^[A-Z0-9]{2,6} Files$' | sort -fu | head -1000 || true

          echo '=== Chip 1999 ACCUSOFT directory extent from generated index ==='
          curl -fL --retry 3 -o chip-index.zip 'https://archive.org/download/czchip199908cd/Chip_1999-08_cd_dic-files.zip'
          unzip -qo chip-index.zip 'Chip_1999-08_cd_mainInfo.txt' -d chip
          INFO=chip/Chip_1999-08_cd_mainInfo.txt
          grep -n -E 'LBA\[0*864|LBA\[0*753' "$INFO" | head -20 || true
          line=$(grep -n -m1 -E 'LBA\[0*864' "$INFO" | cut -d: -f1 || true)
          if [ -n "$line" ]; then
            lo=$((line-8)); hi=$((line+180)); sed -n "${lo},${hi}p" "$INFO"
          fi
