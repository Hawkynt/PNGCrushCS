name: Temporary LPG ImageGear research

on:
  push:
    branches: [research/lpg-imagegear]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Execute ImageGear header detector without init
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/ig
          mkdir -p "$ROOT"
          cd "$ROOT"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-i686 wine32:i386 wine p7zip-full

          echo '=== recover ImageGear 7 DLL ==='
          curl -A "$UA" -fsSL 'https://www.dll-files.com/gear32sd.dll.html' -o index.html
          rel=$(grep -oE '/download/[A-Za-z0-9]+/gear32sd\.dll\.html\?c=[A-Za-z0-9=]+' index.html | head -1)
          curl -A "$UA" -fsSL "https://www.dll-files.com$rel" -o landing.html
          zipurl=$(python3 - <<'PY'
          import html,re
          s=open('landing.html',encoding='utf-8').read()
          m=re.search(r'https://download\.zip\.dll-files\.com/[^"<]+gear32sd\.zip\?token=[^"<&]+(?:&amp;|&)expires=[0-9]+',s)
          print(html.unescape(m.group(0)))
          PY
          )
          curl -A "$UA" -fL "$zipurl" -o gear.zip
          unzip -qo gear.zip -d g7
          cp "$(find g7 -type f -iname 'gear32sd.dll' -print -quit)" GEAR7.DLL

          echo '=== recover Canvas-bundled 1998 ImageGear DLL ==='
          curl -fL --retry 3 -o canvas7.iso 'https://archive.org/download/canvas-702-windows-1999/Canvas-702-Windows-1999.iso'
          mkdir cab old
          7z e -y -ocab canvas7.iso Canvas7/DefaultProgram.Cab >/dev/null
          7z x -y -oold cab/DefaultProgram.Cab >/dev/null
          cp "$(find old -type f -iname '*GEAR32SD.DLL' -print -quit)" GEAR98.DLL
          echo "G7 $(sha256sum GEAR7.DLL)"
          echo "G98 $(sha256sum GEAR98.DLL)"

          python3 - <<'PY'
          import struct,zlib
          from pathlib import Path
          white=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 01 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 53 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 1c 35')
          black=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 02 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 54 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 35 40 35')
          for name,data in [('white.bin',white),('black.bin',black),('white.igf',white),('white.lpg',white)]: Path(name).write_bytes(data)
          row=b'\x00\x00\xff\x00'
          Path('known.bmp').write_bytes(b'BM'+struct.pack('<IHHI',58,0,0,54)+struct.pack('<IIIHHIIIIII',40,1,1,1,24,0,4,2835,2835,0,0)+row)
          Path('known.pcx').write_bytes(bytes([10,5,1,8])+struct.pack('<HHHHHH',0,0,0,0,72,72)+bytes(48)+bytes([0,1])+struct.pack('<H',1)+bytes(60)+bytes([255,0,0]))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          Path('known.png').write_bytes(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1,1,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b'\x00\xff\x00\x00'))+chunk(b'IEND',b''))
          PY

          cat > probe.c <<'C'
          #include <windows.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef int (__cdecl *fn_info)(const char*,int*,int*,void*);
          typedef int (__cdecl *fn_load)(const char*,uint32_t*);
          typedef int (__cdecl *fn_dims)(uint32_t,uint32_t*,uint32_t*,int*);
          typedef int (__cdecl *fn_errcheck)(void);
          typedef void (__cdecl *fn_errget)(int,char*,int,int*,int*,long*,long*);
          typedef void (__cdecl *fn_errclear)(void);
          static void errors(HMODULE m,int n){
            fn_errget get=(fn_errget)GetProcAddress(m,"IG_error_get");
            fn_errclear clear=(fn_errclear)GetProcAddress(m,"IG_error_clear");
            if(get) for(int i=0;i<n;i++){char mod[128]={0};int line=0,code=0;long v1=0,v2=0;get(i,mod,sizeof mod,&line,&code,&v1,&v2);printf(" ERR[%d] code=%d module=%s line=%d v1=%ld v2=%ld",i,code,mod,line,v1,v2);}
            if(clear) clear();
          }
          int main(int argc,char**argv){
            if(argc<3)return 1;
            HMODULE m=LoadLibraryA(argv[1]); if(!m){printf("DLL %s loadfail=%lu\n",argv[1],GetLastError());return 2;}
            fn_info info=(fn_info)GetProcAddress(m,"IG_info_get"); fn_load load=(fn_load)GetProcAddress(m,"IG_load_file"); fn_dims dims=(fn_dims)GetProcAddress(m,"IG_image_dimensions_get"); fn_errcheck chk=(fn_errcheck)GetProcAddress(m,"IG_error_check");
            printf("DLL=%s info=%p load=%p dims=%p errcheck=%p\n",argv[1],info,load,dims,chk);
            for(int i=2;i<argc;i++){
              int fmt=-1,comp=-1; unsigned char dib[256]; memset(dib,0xcc,sizeof dib);
              int rc=info?info(argv[i],&fmt,&comp,dib):-999; int ec=chk?chk():rc;
              printf("INFO %s rc=%d ec=%d fmt=%d comp=%d dib=",argv[i],rc,ec,fmt,comp); for(int j=0;j<40;j++)printf("%02x",dib[j]); errors(m,ec); puts("");
              uint32_t h=0; rc=load?load(argv[i],&h):-999; ec=chk?chk():rc; printf("LOAD %s rc=%d ec=%d h=%08x",argv[i],rc,ec,h);
              if(h&&dims){uint32_t w=0,hh=0;int bpp=0;int dr=dims(h,&w,&hh,&bpp);printf(" dims=%d:%ux%u/%d",dr,w,hh,bpp);} errors(m,ec); puts("");
            }
            return 0;
          }
          C
          i686-w64-mingw32-gcc -O2 probe.c -o probe.exe
          export WINEDEBUG=-all
          wineboot -u >/dev/null 2>&1 || true
          for dll in GEAR7.DLL GEAR98.DLL; do
            echo "=== ORACLE $dll ==="
            wine ./probe.exe "$dll" known.bmp known.pcx known.png white.bin black.bin white.igf white.lpg || true
          done

          echo '=== Chip ACCUSOFT/ImageGear directory records ==='
          curl -fL --retry 3 -o chip-index.zip 'https://archive.org/download/czchip199908cd/Chip_1999-08_cd_dic-files.zip'
          unzip -qo chip-index.zip 'Chip_1999-08_cd_mainInfo.txt' -d chip
          INFO=chip/Chip_1999-08_cd_mainInfo.txt
          grep -n -i -B4 -A8 'IMAGEG~1\|ACCUSOFT' "$INFO" | head -300 || true
