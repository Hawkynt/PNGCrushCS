name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ImageGear 7 DLL oracle
        shell: bash
        run: |
          set -u
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"

          echo '=== Download ImageGear DLL package ==='
          URL='https://www.dll-files.com/download/bd31e50ee4450d52d0a9f1a774a94775/gear32sd.dll.html?c=SHZqdk1YN25BY2J1MzNwWHdUbkxOdz09'
          curl -A 'Mozilla/5.0' -fL --max-time 30 -o gear.zip "$URL" || true
          file gear.zip || true
          ls -l gear.zip || true
          unzip -l gear.zip || true
          unzip -o gear.zip -d extracted || true
          find extracted -maxdepth 3 -type f -printf '%p %s bytes\n' || true

          DLL=$(find extracted -type f -iname 'gear32sd.dll' -print -quit)
          if [ -z "${DLL:-}" ]; then
            echo 'NO_DLL'
            exit 0
          fi

          echo '=== Hash ==='
          sha256sum "$DLL"
          md5sum "$DLL"
          file "$DLL"

          echo '=== PE exports containing useful ImageGear APIs ==='
          objdump -p "$DLL" | grep -iE 'IG_(initialize|close|load_file|save_file|info_get|image_|fltr_|error_)|IGF|FORMAT|SAVE_' | head -400 || true

          echo '=== Strings related to IGF / file formats ==='
          strings -a "$DLL" | grep -iE -B4 -A8 '(^|[^A-Za-z])(IGF|ImageGear Format|IG_FORMAT_|IG_SAVE_|\.igf|\.lpg|Paris|Xerox)([^A-Za-z]|$)' | head -800 || true

          echo '=== All extension-like strings near obscure formats ==='
          strings -a "$DLL" | grep -iE 'ATT|BRK|GX2|ICA|IMT|KFX|\.LV|Xerox|IMG|IGF|PCX|LPG' | head -500 || true

          echo '=== Embedded version/product strings ==='
          strings -el "$DLL" | grep -iE 'ImageGear|AccuSoft|version|format' | head -200 || true

          echo '=== Candidate raster sample files ==='
          python3 - <<'PY'
          from pathlib import Path
          white=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 01 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 53 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 1c 35')
          black=bytes.fromhex('50 50 03 00 01 00 00 00 01 00 00 00 52 00 00 00 02 00 00 00 96 00 96 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 00 00 00 54 00 00 00 01 00 00 00 00 01 00 01 f0 00 00 00 e5 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 35 40 35')
          Path('white.bin').write_bytes(white)
          Path('black.bin').write_bytes(black)
          PY
          file white.bin black.bin || true
          xxd -g1 white.bin
