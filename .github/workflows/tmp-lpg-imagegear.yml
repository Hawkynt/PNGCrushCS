name: Temporary LPG ImageGear research

on:
  push:
    branches:
      - research/lpg-imagegear

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recovered ImageGear DLL
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/lpg-imagegear
          mkdir -p "$ROOT"
          cd "$ROOT"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          curl -A "$UA" -fsSL 'https://www.dll-files.com/gear32sd.dll.html' -o index.html
          rel=$(grep -oE '/download/[A-Za-z0-9]+/gear32sd\.dll\.html\?c=[A-Za-z0-9=]+' index.html | head -1)
          curl -A "$UA" -fsSL "https://www.dll-files.com$rel" -o landing.html
          zipurl=$(python3 - <<'PY'
          import html,re
          s=open('landing.html',encoding='utf-8').read()
          m=re.search(r'https://download\.zip\.dll-files\.com/[^"<]+gear32sd\.zip\?token=[^"<&]+(?:&amp;|&)expires=[0-9]+',s)
          if not m: raise SystemExit(2)
          print(html.unescape(m.group(0)))
          PY
          )
          echo "CDN=$zipurl"
          curl -A "$UA" -fL "$zipurl" -o gear32sd.zip
          unzip -l gear32sd.zip
          unzip -o gear32sd.zip -d extracted
          DLL=$(find extracted -type f -iname 'gear32sd.dll' -print -quit)
          echo "DLL=$DLL"
          file "$DLL"
          sha256sum "$DLL"
          md5sum "$DLL"
          stat -c '%s bytes' "$DLL"

          echo '=== matching published hashes ==='
          test "$(sha256sum "$DLL" | cut -d' ' -f1)" = 'a42787bc5c747f306169b28d5d0e7b71c16ad48a4bc11b2b434117d349e130c2'
          test "$(md5sum "$DLL" | cut -d' ' -f1)" = 'bd31e50ee4450d52d0a9f1a774a94775'

          echo '=== exports ==='
          objdump -p "$DLL" > pe.txt
          grep -iE 'IG_(initialize|close|load_file|save_file|info_get|info_|image_|fltr_|error_)' pe.txt | head -1000 || true

          echo '=== all likely format strings ==='
          strings -a "$DLL" > strings.txt
          grep -inE -B5 -A12 'IGF|ImageGear Format|\.igf|\.lpg|LPG|Xerox|XIMG|\.img|ATT|BRK|GX2|ICA|IMT|KFX' strings.txt | head -1600 || true

          echo '=== exported function names from OpenDLL-like PE table ==='
          grep -oE '_?IG_[A-Za-z0-9_]+(@[0-9]+)?' pe.txt | sort -u | grep -E 'initialize|close|load|save|info|image|error|format|fltr' | head -1000 || true

          echo '=== PE version ==='
          strings -el "$DLL" | grep -iE 'ImageGear|AccuSoft|7\.0|FileDescription|Product' | head -200 || true
