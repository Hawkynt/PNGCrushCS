name: Temporary Office image writers validation

on:
  push:
    branches: [image/powerpoint-writer]

permissions:
  contents: write

jobs:
  validate-and-refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS

      - name: Checkout CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Refresh hand-written Office support rationale
        working-directory: PNGCrushCS
        shell: python
        run: |
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.Images/README.md")
          text = path.read_text(encoding="utf-8-sig")

          old = (
              "PowerPoint is writable at the same image boundary its reader exposes: arbitrary pixels are "
              "encoded losslessly as a PNG OfficeArt BLIP in a valid CFB `Pictures` stream. The writer does "
              "not synthesize slides, text, transitions or the rest of the PowerPoint document model, so the "
              "Write tick means the same `PowerPoint (images)` carrier the compatibility reader understands, "
              "not a claim that this package authors complete slide decks."
          )
          new = (
              "Office document image carriers are writable without external Office libraries. Word Open XML "
              "documents/templates contain the picture as an inline drawing; Excel Open XML workbooks/templates "
              "contain it in a worksheet drawing anchored at A1; and modern PowerPoint presentations/slideshows/"
              "templates contain it on a real slide with a master, layout, and theme. Macro-capable variants use "
              "their native package content types but do not fabricate a VBA project. Legacy `.ppt`/`.pps`/`.pot` "
              "remain the compatibility image-carrier boundary and store the PNG as an OfficeArt BLIP in a CFB "
              "`Pictures` stream."
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              heading = "### Registered but read-only"
              if heading not in text:
                  raise SystemExit("Office support rationale insertion point is missing")
              text = text.replace(heading, new + "\n\n" + heading, 1)

          path.write_text(text, encoding="utf-8")

      - name: Run focused Office writer and support-table tests
        working-directory: PNGCrushCS
        shell: bash
        env:
          UPDATE_IMAGE_FORMAT_README: "1"
        run: |
          set -o pipefail
          dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj \
            -p:EnableWindowsTargeting=true \
            --filter "FullyQualifiedName~PowerPoint|FullyQualifiedName~Word|FullyQualifiedName~Excel|FullyQualifiedName~OfficeOpenXml|FullyQualifiedName~FormatSupportReadmeTests" \
            2>&1 | tee office-focused-tests.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-focused-tests
          path: PNGCrushCS/office-focused-tests.log
          if-no-files-found: ignore

      - name: Build solution
        working-directory: PNGCrushCS
        run: dotnet build PngCrush.slnx -c Release -p:EnableWindowsTargeting=true

      - name: Commit regenerated README
        working-directory: PNGCrushCS
        shell: bash
        run: |
          if git diff --quiet -- Hawkynt.FileFormats.Images/README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Images/README.md
          git commit -m "Regenerate Office image format support table"
          git push origin HEAD:image/powerpoint-writer
