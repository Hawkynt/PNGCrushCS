name: Temporary PowerPoint writer validation

on:
  push:
    branches: [image/powerpoint-writer]

permissions:
  contents: write

jobs:
  validate-and-refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS

      - name: Checkout CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Refresh hand-written PowerPoint support rationale
        working-directory: PNGCrushCS
        shell: python
        run: |
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.Images/README.md")
          text = path.read_text(encoding="utf-8-sig")

          text = text.replace("These 29 entries read but have no writer;", "These 28 entries read but have no writer;", 1)
          text = text.replace("PeResource, PowerPoint, Fpx, PocketPcTheme", "PeResource, Fpx, PocketPcTheme", 1)

          heading = "### Registered but read-only"
          rationale = (
              "PowerPoint is writable at the same image boundary its reader exposes: arbitrary pixels are "
              "encoded losslessly as a PNG OfficeArt BLIP in a valid CFB `Pictures` stream. The writer does "
              "not synthesize slides, text, transitions or the rest of the PowerPoint document model, so the "
              "Write tick means the same `PowerPoint (images)` carrier the compatibility reader understands, "
              "not a claim that this package authors complete slide decks."
          )
          if rationale not in text:
              if heading not in text:
                  raise SystemExit("PowerPoint support rationale insertion point is missing")
              text = text.replace(heading, rationale + "\n\n" + heading, 1)

          if "These 28 entries read but have no writer;" not in text or "PeResource, Fpx, PocketPcTheme" not in text:
              raise SystemExit("PowerPoint read-only paragraph did not update as expected")

          path.write_text(text, encoding="utf-8")

      - name: Run focused writer and support-table tests
        working-directory: PNGCrushCS
        env:
          UPDATE_IMAGE_FORMAT_README: "1"
        run: >-
          dotnet test Tests/Hawkynt.FileFormats.Images.Tests/Hawkynt.FileFormats.Images.Tests.csproj
          -p:EnableWindowsTargeting=true
          --filter "FullyQualifiedName~PowerPoint|FullyQualifiedName~FormatSupportReadmeTests"

      - name: Build solution
        working-directory: PNGCrushCS
        run: dotnet build PngCrush.slnx -c Release -p:EnableWindowsTargeting=true

      - name: Commit regenerated README
        working-directory: PNGCrushCS
        shell: bash
        run: |
          if git diff --quiet -- Hawkynt.FileFormats.Images/README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Images/README.md
          git commit -m "Regenerate image format support table"
          git push origin HEAD:image/powerpoint-writer
