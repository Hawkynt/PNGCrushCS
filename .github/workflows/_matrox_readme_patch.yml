name: Matrox documentation patch

on:
  push:
    branches:
      - codec/matrox-read-write
    paths:
      - .github/workflows/_matrox_readme_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codec/matrox-read-write
      - name: Finalize video support ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Hawkynt.FileFormats.Video/README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '| Matrox Uncompressed SD | ✅ | ✅ | none |': '| Matrox Uncompressed SD | ✅ | ✅ | ffmpeg |',
            '| Matrox Uncompressed HD | ✅ | ✅ | none |': '| Matrox Uncompressed HD | ✅ | ✅ | ffmpeg |',
            "encoder nothing else has looked at: MagicYUV, because this ffmpeg build ships that codec's encoder\nand not its decoder; Matrox Uncompressed SD and HD, whose writers are checked here against the\nreference layout but have not yet been opened by an external decoder; and Planar raw YUV, because\nno container here names it with a code ffmpeg maps to a decoder.": "encoder nothing else has looked at: MagicYUV, because this ffmpeg build ships that codec's encoder\nand not its decoder, and Planar raw YUV, because no container here names it with a code ffmpeg maps\nto a decoder.",
          }

          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
            text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit ledger and remove helper workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_matrox_readme_patch.yml
          git add Hawkynt.FileFormats.Video/README.md
          git commit -m "Finalize Matrox read-write documentation"
          git push origin HEAD:codec/matrox-read-write
