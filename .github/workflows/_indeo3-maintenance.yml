name: Indeo 3 encoder maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-document:
    if: github.head_ref == 'video/indeo3-temporal-frames'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: PNGCrushCS
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Restore
        working-directory: PNGCrushCS
        run: dotnet restore PngCrush.slnx -p:EnableWindowsTargeting=true

      - name: Build
        working-directory: PNGCrushCS
        run: dotnet build PngCrush.slnx --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Update Indeo 3 measurement notes
        working-directory: PNGCrushCS
        shell: python
        run: |
          from pathlib import Path

          path = Path('Hawkynt.FileFormats.Video/codec-notes.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Intel Indeo 3\n\n'
          old = (
              "The writer deliberately starts at the format's interoperable floor rather than trying to reproduce "
              "Intel's encoder heuristics: every packet is an IV32 key frame, each plane is one intra cell, mode 0, "
              "quantisation table 0, and there are no motion vectors. RGB input is reduced to the codec's seven-bit "
              "YUV 4:1:0 planes; each dyad is selected against the exact packed 16-bit addition used by the decoder, "
              "so encoder-side reconstruction follows the same carries and masks as decoding. The registry's FFmpeg "
              "oracle muxes the packets into AVI and requires FFmpeg to decode them, independently of this package's "
              "own decoder.\n\n"
          )
          new = (
              "**Encoding writes intra and forward-predicted frames.** A twelve-picture group opens with an IV32 "
              "key frame and continues with eleven inter frames. The format owns two picture buffers; the writer "
              "alternates them and predicts each inter picture from the reconstruction in the other buffer, not from "
              "the source image, so seven-bit YUV 4:1:0/VQ quantisation error cannot accumulate as reference drift. "
              "Inter planes use the ordinary motion-compensated cell syntax with vector 0,0 and mode-0 residuals; "
              "unchanged 4x4 blocks use the FA/FB copy escapes and a wholly unchanged plane collapses to a VQ-tree "
              "copy leaf. There is no display-order reordering or B-picture analogue in Indeo 3. Non-zero motion "
              "search would improve compression but is not required for the format's reference semantics.\n\n"
              "The registry's FFmpeg oracle muxes thirteen packets into AVI and requires FFmpeg to decode the complete "
              "I/P chain across a group boundary. The writer deliberately does not guess the obscure SkipCell procedure, "
              "which FFmpeg itself leaves unimplemented; eight-bit samples and half-sample motion vectors remain refused "
              "for the same reasons as the decoder.\n\n"
          )

          if old in text:
            text = text.replace(old, new, 1)
          elif new not in text:
            count = text.count(marker)
            if count != 1:
              raise SystemExit(f'expected exactly one Indeo 3 notes heading, found {count}')
            text = text.replace(marker, marker + new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Generate package documentation
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: PNGCrushCS
          configuration: Release

      - name: Test required tier
        working-directory: PNGCrushCS
        run: dotnet test PngCrush.slnx --configuration Release --no-build -p:EnableWindowsTargeting=true --filter "TestCategory!=Regression&TestCategory!=Performance"

      - name: Commit generated Indeo 3 documentation and remove maintenance workflow
        shell: bash
        run: |
          cd PNGCrushCS
          git rm .github/workflows/_indeo3-maintenance.yml
          git config user.name "Hawkynt"
          git config user.email "14230988+Hawkynt@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md Hawkynt.FileFormats.Video/codec-notes.md
          git commit -m "* document Indeo 3 temporal encoding"
          git push origin HEAD:${{ github.head_ref }}
