name: Temporary H.261 oracle validation

on:
  push:
    branches: [fix/h261-oracle-keyframe-warning]

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Ensure FFmpeg oracle is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Restore video tests
        run: dotnet restore Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Run encoder registry oracle suite with FFmpeg
        run: dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true --filter "FullyQualifiedName~EncoderOracleTests.TheOracleAnEncoderClaims_ReadsBackWhatItWrites"

      - name: Run complete video test project with FFmpeg
        run: dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-h261-oracle-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary H.261 oracle validation workflow"
          git push origin HEAD:fix/h261-oracle-keyframe-warning
