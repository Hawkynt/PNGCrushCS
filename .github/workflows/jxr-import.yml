name: Import managed JPEG XR reference core

on:
  push:
    branches: [fix/image-format-warning-coverage]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned SharpAstro JXR core
        shell: bash
        run: |
          set -euo pipefail
          upstream=/tmp/sharpastro-codecs
          target=Hawkynt.FileFormats.Images/Formats/JpegXr/Reference
          rm -rf "$upstream" "$target"
          git clone --filter=blob:none --no-checkout https://github.com/SharpAstro/Codecs.git "$upstream"
          git -C "$upstream" checkout 7cad99deda0e6c68f68e1c9c64d442c5b85d48a2 -- src/SharpAstro.Jxr UNLICENSE
          mkdir -p "$target"
          for src in "$upstream"/src/SharpAstro.Jxr/*.cs; do
            base=$(basename "$src")
            case "$base" in
              JxrContainer.cs|JxrImageCodec.cs|JxrImageDecoder.cs) continue ;;
            esac
            cp "$src" "$target/$base"
          done
          cat > "$target/GlobalUsings.cs" <<'EOF'
          global using System;
          global using System.Collections.Generic;
          global using System.IO;
          global using System.Linq;
          global using System.Threading;
          global using System.Threading.Tasks;
          EOF
          cat > "$target/UPSTREAM.md" <<'EOF'
          # JPEG XR reference core attribution

          The files in this directory are derived verbatim from `SharpAstro/Codecs`,
          `src/SharpAstro.Jxr`, pinned at commit
          `7cad99deda0e6c68f68e1c9c64d442c5b85d48a2` (2026-08-20).

          SharpAstro.Jxr is a pure-managed C# port of Microsoft's JXRLib JPEG XR
          reference implementation. The upstream repository dedicates the code to
          the public domain under the Unlicense. Only the self-contained T.832 codec
          core is imported here; SharpAstro's T.833/TIFF facade and generic codec
          adapters are intentionally excluded because this repository supplies its
          own JPEG XR container and RawImage integration.

          Upstream: https://github.com/SharpAstro/Codecs
          EOF
          cp "$upstream/UNLICENSE" "$target/UNLICENSE"
      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Images/Formats/JpegXr/Reference
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Vendor managed JXRLib-compatible JPEG XR core"
          git push origin HEAD:fix/image-format-warning-coverage
