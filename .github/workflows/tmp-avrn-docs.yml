name: Temporary AVDJ validation and documentation regeneration

on:
  push:
    branches: [video/avid-meridien-compressed]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Check out CompressionWorkbench sibling
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Update AVDJ support ledger and codec notes
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $readmePath = 'Hawkynt.FileFormats.Video/README.md'
          $readme = Get-Content -Raw $readmePath
          $newRow = '| [Avid Meridien Compressed](https://resources.avid.com/SupportFiles/attach/IOGuide_v10_0.pdf) | ⚠️ | ✅ | ffmpeg | `AVDJ`; intra-only baseline 4:2:2 JFIF/Motion JPEG. Progressive packets are one JPEG; standard 720x486 NTSC and 720x576 PAL packets are two JPEG fields in Avid''s documented lower-first/upper-first order. Avid''s top-padding crop is honored. The alpha-bearing variant is deliberately refused because no public bitstream description identifies its alpha representation. The writer emits opaque 4:2:2 JPEG at fixed quality and every packet is a key frame | [Avid Input and Output Guide](https://resources.avid.com/SupportFiles/attach/IOGuide_v10_0.pdf) |'
          if (-not $readme.Contains('Avid Meridien Compressed')) {
            $pattern = '(?m)^(\| \[Avid AVRn\].*\|)$'
            if (-not [regex]::IsMatch($readme, $pattern)) { throw 'The Avid AVRn support row could not be found.' }
            $readme = [regex]::Replace($readme, $pattern, ('$1' + "`n" + $newRow), 1)
          }
          $readme = $readme.Replace('builds, 100 of them;', 'builds, 101 of them;')
          $readme = $readme.Replace('builds, 70 of them.', 'builds, 71 of them.')
          [System.IO.File]::WriteAllText($readmePath, $readme, $utf8)

          $notesPath = 'Hawkynt.FileFormats.Video/codec-notes.md'
          $notes = Get-Content -Raw $notesPath
          if (-not $notes.Contains('### Avid Meridien Compressed')) {
            $section = @'
          ### Avid Meridien Compressed

          `AVDJ` is the compressed Meridien spelling, distinct from `AVUI` (Meridien Uncompressed).
          The coded pictures are Avid JFIF/Motion JPEG and have no inter-picture prediction: every packet
          is independently decodable, so there are no forward/backward references and no P/B pictures to
          reconstruct. FFmpeg maps `AVDJ` to its MJPEG decoder and applies the same Avid display crop it uses
          for non-1:1 `AVRn`: when the coded JPEG is taller than the container picture, the excess is above the
          display picture, so the decoder keeps the bottom rows and left columns.

          Avid's own Input and Output Guide supplies the field rule rather than an implementation guess.
          Meridien NTSC is 720x243x2 and lower-field-first; Meridien PAL is 720x288x2 and upper-field-first.
          The decoder also understands QuickTime's public `fiel` extension and the old Avid MJPEG codec-data
          discriminator that FFmpeg recognizes (`1` for NTSC, `2` for PAL), so non-D1 two-field material is
          decoded when its stream description actually states the temporal polarity. Without any such signal,
          a non-standard two-field packet is refused rather than guessed.

          Field packets are split with `JpegChunkLayout.FirstImageLength`, the image package's existing JPEG
          segment/entropy walker. Searching for `FF D9` would be wrong because those bytes may occur in a scan
          or inside an APP thumbnail. Each field is decoded independently, checked for matching geometry and
          pixel layout, woven onto alternating output rows, and only then cropped to the container geometry.
          Truncated second fields and mismatched field pairs fail as malformed input.

          The writer reuses `JpegManagedEncoder` and explicitly requests baseline 4:2:2. Standard 720x486 and
          720x576 pictures are split into two temporal fields before JPEG coding; other geometries are emitted
          as one progressive JPEG so the same `AVDJ` bitstream remains usable for scaled/progressive material.
          The QuickTime visual sample description carries `fiel` detail 14 for the 486-line lower-first case,
          detail 9 for the 576-line upper-first case, and one-field detail 0 for progressive pictures. The video
          encoder contract has no quality/rate-control option, so the JPEG quality is fixed at 90. All packets
          are key frames.

          Avid documentation says Meridien Compressed can carry alpha, but the public documentation consulted
          does not define its coded alpha layout and FFmpeg's current `AVDJ` route exposes no Avid-specific
          alpha reconstruction to use as a behavioral oracle. The implementation therefore accepts opaque
          alpha-bearing source buffers but refuses any non-opaque alpha and does not reinterpret a second JPEG
          or a four-component JPEG as alpha. That is the deliberate reason for the amber decode cell.

          Sources used for the clean-room behavior are Avid's Input and Output Guide, Apple's QuickTime `fiel`
          documentation, ITU-T T.81, and FFmpeg's LGPL-2.1-or-later MJPEG decoder as a behavioral oracle. The
          target is LGPL-3.0-or-later; no FFmpeg implementation structure or expressive code is reproduced and
          no new dependency is introduced.
          '@
            $marker = '### Avid AVRn'
            $at = $notes.IndexOf($marker, [System.StringComparison]::Ordinal)
            if ($at -lt 0) { throw 'The Avid AVRn codec-notes section could not be found.' }
            $notes = $notes.Insert($at, $section.Trim() + "`n`n")
          }
          [System.IO.File]::WriteAllText($notesPath, $notes, $utf8)

      - name: Restore
        working-directory: PNGCrushCS
        run: dotnet restore PngCrush.slnx -p:EnableWindowsTargeting=true

      - name: Build
        working-directory: PNGCrushCS
        run: dotnet build PngCrush.slnx --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Test AVDJ and support ledger
        working-directory: PNGCrushCS
        run: dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-build -p:EnableWindowsTargeting=true --filter "FullyQualifiedName~AvidMeridienCompressed|FullyQualifiedName~VideoReadmeStateTests"

      - name: Regenerate package documentation
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: PNGCrushCS
          configuration: Release

      - name: Commit generated documentation
        working-directory: PNGCrushCS
        shell: bash
        run: |
          if git diff --quiet -- Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md Hawkynt.FileFormats.Video/codec-notes.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md Hawkynt.FileFormats.Video/codec-notes.md
          git commit -m "* document Avid Meridien Compressed support"
          git push origin HEAD:video/avid-meridien-compressed
