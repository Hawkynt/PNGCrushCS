name: Temporary LPG DiscMaster oracle probe

on:
  push:
    branches:
      - research/lpg-paris-oracle

jobs:
  discmaster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe DiscMaster
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lpg-probe
          mkdir -p /tmp/lpg-probe
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          OUT = pathlib.Path('/tmp/lpg-probe')
          BASE = 'https://discmaster.textfiles.com'
          NAME_QUERIES = ('MS-LOGO.LPG', 'RainDay.pcx', 'mercury1.pcx', 'Robsig.pcx', 'Robsig1.pcx', 'PMCONFIG.EXE', 'PARISPM.DLL', 'STOCKSET.XPI')
          TRACE_QUERIES = ('XLPrint', 'Laser Image Technologies', 'Paris Document System', 'Lapres', 'PMCONFIG.EXE', 'PARISPM.DLL', 'STOCKSET.XPI')

          def fetch(url: str) -> tuple[int, str, str, bytes]:
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 LPG-format-research',
                  'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8',
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  return response.status, response.geturl(), response.headers.get('content-type', ''), response.read()

          def save(label: str, params: dict[str, str]) -> bytes:
              url = BASE + '/search?' + urllib.parse.urlencode(params)
              status, final_url, content_type, body = fetch(url)
              safe = re.sub(r'[^A-Za-z0-9_.-]+', '_', label)
              (OUT / f'{safe}.body').write_bytes(body)
              (OUT / f'{safe}.meta.json').write_text(json.dumps({
                  'request_url': url,
                  'status': status,
                  'final_url': final_url,
                  'content_type': content_type,
                  'length': len(body),
                  'sha256': hashlib.sha256(body).hexdigest(),
              }, indent=2), encoding='utf-8')
              text = body.decode('utf-8', 'replace')
              count = re.search(r'<font size="\+1">([0-9,]+) results', text)
              print(f'{label}: {count.group(1) if count else "?"} results, {len(body)} bytes')
              for match in re.findall(r'href="(/view/[^"]+)"', text, re.I)[:30]:
                  print(' ', html.unescape(match))
              return body

          for query in NAME_QUERIES:
              save('name_' + query, {'q': query, 'qfields': 'name', 'mode': 'deep', 'dedup': 'dedup', 'limit': '200'})

          for query in TRACE_QUERIES:
              save('trace_' + query, {'q': query, 'mode': 'deep', 'dedup': 'dedup', 'limit': '200'})

          save('extension_lpg', {'extension': 'lpg', 'mode': 'deep', 'dedup': 'dedup', 'limit': '500'})
          PY

      - name: Upload probe responses
        uses: actions/upload-artifact@v4
        with:
          name: lpg-discmaster-trace-probe
          path: /tmp/lpg-probe
          if-no-files-found: error
