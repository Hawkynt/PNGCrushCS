name: Hap README one-shot sync

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Hap README claims
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("Hawkynt.FileFormats.Video/README.md")
          text = path.read_text(encoding="utf-8")

          hap_row = "| Hap | ⚠️ | ✅ | ffmpeg, Vidvox Hap + bcdec | `Hap1`, `Hap5`, `HapY`, `HapM`, `HapA`, `Hap7`, `HapH`. Unknown texture formats, second-stage compressors, and image combinations Hap does not define are refused. The encoder writes all seven variants: BC1, BC3, Scaled YCoCg, Scaled YCoCg + BC4 alpha, BC4 alpha-only, BC7, and BC6H; `HapH` selects unsigned or signed BC6H from the finite input samples. Frames may be emitted as one texture section or as equal block-aligned chunks, with each chunk independently stored raw or Snappy-compressed. Hap is intra-only, so every packet is a key frame with no forward/backward reference state. DXT/BC texture coding is lossy except where its quantised endpoint/index representation states the source samples exactly. ffmpeg remains the independent reader for the classic Hap variants; Vidvox `HapDecode` plus bcdec independently validate the Hap R BC7 and signed/unsigned Hap HDR BC6H output | [Vidvox Hap `HapVideoDRAFT.md`](https://github.com/Vidvox/hap/blob/master/documentation/HapVideoDRAFT.md) |"
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("| Hap |")]
          if len(matches) != 1:
            raise SystemExit(f"expected exactly one Hap support row, found {len(matches)}")
          lines[matches[0]] = hap_row
          text = "\n".join(lines) + "\n"

          oracle = """**Oracle** names the program outside this repository that has read what the encoder writes.
          [ffmpeg](https://ffmpeg.org/) covers most codecs. Hap additionally uses
          [Vidvox Hap + bcdec](https://github.com/Vidvox/hap): Vidvox's reference `HapDecode` extracts the
          compressed BC7/BC6H texture and [bcdec](https://github.com/iOrange/bcdec) independently decodes those
          texture blocks. `—` is a codec with no encoder, so there is nothing for anything to have read. `none`
          is an encoder nothing else has looked at. The claim is declared by `[VerifiedBy]` on the encoder type,
          carried into `VideoCodecEncoderEntry.VerifiedBy` by the registry generator, and held to what it says by
          [`EncoderOracleTests`](https://github.com/Hawkynt/PNGCrushCS/blob/main/Tests/Hawkynt.FileFormats.Video.Tests/EncoderOracleTests.cs).
          The ordinary runner asks ffmpeg to decode a frame back at the size that went in; the Hap runner creates
          deterministic Hap R and signed/unsigned Hap HDR frames, sends their framing through Vidvox `HapDecode`,
          and compares bcdec's reconstructed samples against the source. Either is stronger evidence than this
          package's own decoder agreeing with its own encoder, which is what the column exists to stop being
          mistaken for evidence."""
          pattern = re.compile(r"(?ms)^\*\*Oracle\*\* names the program outside this repository that has read what the encoder writes —\n.*?\n(?=### Not supported, and why)")
          text, count = pattern.subn(oracle + "\n\n", text)
          if count != 1:
            raise SystemExit(f"expected exactly one codec oracle prose block, replaced {count}")

          vidvox_ref = "| [Vidvox Hap + bcdec](https://github.com/Vidvox/hap) | Oracle | Hap R/HDR interoperability: Vidvox `HapDecode` validates Hap framing and extracts the texture payload; [bcdec](https://github.com/iOrange/bcdec) independently decodes BC7 and signed/unsigned BC6H samples. CI pins both upstream revisions. |"
          if vidvox_ref not in text:
            ref_lines = text.splitlines()
            ffmpeg = [i for i, line in enumerate(ref_lines) if line.startswith("| [FFmpeg](https://ffmpeg.org/) | Foreign source code + oracle |")]
            if len(ffmpeg) != 1:
              raise SystemExit(f"expected exactly one FFmpeg reference row, found {len(ffmpeg)}")
            ref_lines.insert(ffmpeg[0] + 1, vidvox_ref)
            text = "\n".join(ref_lines) + "\n"

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          test "$(git diff --name-only)" = "Hawkynt.FileFormats.Video/README.md"
          git diff -- Hawkynt.FileFormats.Video/README.md

      - name: Commit README synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.Video/README.md
          test "$(git diff --cached --name-only)" = "Hawkynt.FileFormats.Video/README.md"
          git commit -m "Synchronize Hap README oracle scope"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
