name: Temporary non-Oracle video validation

on:
  push:
    branches: [complete/msmpeg4-p-intra]

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - name: Restore video tests
        run: dotnet restore Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Run complete non-Oracle video test project
        id: nonoracle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test Tests/Hawkynt.FileFormats.Video.Tests/Hawkynt.FileFormats.Video.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true --filter "TestCategory!=Oracle" --logger "console;verbosity=detailed" 2>&1 | tee /tmp/video-nonoracle.log

      - name: Upload non-Oracle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-nonoracle-diagnostics
          path: /tmp/video-nonoracle.log
          if-no-files-found: error

      - name: Remove temporary validation workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/tmp-msmpeg4-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary MS-MPEG-4 validation workflow"
          git push origin HEAD:complete/msmpeg4-p-intra

      - name: Fail if non-Oracle suite failed
        if: steps.nonoracle.outcome == 'failure'
        run: exit 1
