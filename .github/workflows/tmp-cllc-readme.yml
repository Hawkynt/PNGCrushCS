name: Temporary CLLC README update

on:
  push:
    branches: [feature/canopus-lossless-read-write]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CLLC support ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.Video/README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "| [Canopus Lossless Codec](https://wiki.multimedia.cx/index.php/Canopus_Lossless) | ⚠️ | — | — | `CLLC`; YUV 4:2:2, RGB24 and ARGB. Odd-width 4:2:2 and the blocked YUV coding refused — the latter is unimplemented in the reference decoder too. Adapted from FFmpeg's LGPL-2.1-or-later decoder | [FFmpeg `cllc.c`](https://github.com/FFmpeg/FFmpeg/blob/master/libavcodec/cllc.c) |":
              "| [Canopus Lossless Codec](https://wiki.multimedia.cx/index.php/Canopus_Lossless) | ⚠️ | ✅ | ffmpeg | `CLLC`; YUV 4:2:2, RGB24 and ARGB. Every packet is an independent Huffman-predicted key frame; the writer emits coding types 0, 1 and 3 and the reader also accepts the historical RGB type 2. Native YUV is kept as sample-exact `Yuv422P8`. Odd-width 4:2:2 and blocked YUV are refused — the latter is unimplemented in the reference decoder too — and ARGB hidden colour under alpha zero is refused because that colour is not present in the bitstream. The decoder is adapted from FFmpeg's LGPL-2.1-or-later implementation; the writer independently derives the inverse syntax and is checked by ffmpeg | [FFmpeg `cllc.c`](https://github.com/FFmpeg/FFmpeg/blob/master/libavcodec/cllc.c) |",
              "builds, 70 of them": "builds, 71 of them",
              "70 codecs of the 100 read can also be written": "71 codecs of the 100 read can also be written",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-cllc-readme.yml
          git add Hawkynt.FileFormats.Video/README.md
          git commit -m "Document Canopus Lossless writer support"
          git push origin HEAD:feature/canopus-lossless-read-write
