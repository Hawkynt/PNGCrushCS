name: Update MPEG-4 Part 2 docs

on:
  push:
    branches: [feature/mpeg4-part2-encoder]

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.0.x

      - uses: Hawkynt/RepositoryTemplate/stamp-version@v1
        with:
          mode: stamp
          path: PNGCrushCS

      - name: Build video package
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          dotnet restore Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj -p:EnableWindowsTargeting=true
          dotnet build Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Update support ledger
        shell: pwsh
        run: |
          $path = 'PNGCrushCS/Hawkynt.FileFormats.Video/README.md'
          $text = [IO.File]::ReadAllText($path)

          $replacements = @(
            @('builds, 46 of them.', 'builds, 47 of them.'),
            @('46 codecs of the 100 read can also be written.', '47 codecs of the 100 read can also be written.'),
            @('Most are lossless; twelve are not', 'Most are lossless; thirteen are not'),
            @("Cinepak's vector quantisation, Microsoft's MPEG-4 transform,", "Cinepak's vector quantisation, both ISO MPEG-4 Part 2 and Microsoft's MPEG-4 transform coding,"),
            @('What is still not written back is the modern lossy codecs:', 'What is still not written back is the newer lossy codecs:')
          )

          foreach ($pair in $replacements) {
            if (-not $text.Contains($pair[0])) { throw "README text not found: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }

          $lines = $text -split "`r?`n"
          $found = $false
          for ($i = 0; $i -lt $lines.Length; ++$i) {
            if (-not $lines[$i].StartsWith('| [MPEG-4 Part 2 video (ISO/IEC 14496-2)]')) { continue }
            $lines[$i] = '| [MPEG-4 Part 2 video (ISO/IEC 14496-2)](https://en.wikipedia.org/wiki/MPEG-4_Part_2) | ⚠️ | ✅ | ffmpeg | Rectangular, progressive, 8-bit 4:2:0 I/P/B. Quarter-sample vectors, sprites/GMC, interlace, OBMC, data partitioning, scalability, shape coding, newpred, reduced resolution and the complexity-estimation header each refused where signalled. The encoder writes Advanced Simple I/P/B streams at quantiser 8, with an I-VOP every twelve displayed pictures and two B-VOPs between anchors: P-VOPs use zero-vector temporal prediction plus residuals, and each B macroblock chooses forward, backward or interpolated zero-vector prediction by pre-quantisation squared error. Every packet repeats its VOL so VFW-style containers do not depend on out-of-band configuration. MPEG-4 Part 2 has no lossless mode in this coding path; every coded block is transformed and quantised | [ISO/IEC 14496-2](https://www.iso.org/standard/39259.html) |'
            $found = $true
            break
          }
          if (-not $found) { throw 'MPEG-4 Part 2 support row not found.' }

          [IO.File]::WriteAllText($path, (($lines -join "`n").TrimEnd() + "`n"), [Text.UTF8Encoding]::new($false))

      - name: Regenerate video package API docs
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          root: PNGCrushCS
          project: Hawkynt.FileFormats.Video/Hawkynt.FileFormats.Video.csproj
          upload-artifact: 'false'

      - name: Commit generated documentation
        working-directory: PNGCrushCS
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hawkynt.FileFormats.Video/README.md Hawkynt.FileFormats.Video/REFERENCE.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Document MPEG-4 Part 2 encoding support'
          git push origin HEAD:${{ github.ref_name }}
