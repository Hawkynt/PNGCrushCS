name: Temporary MSZH corpus validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch archived MSZH samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mszh-samples
          base=https://samples.ffmpeg.org/V-codecs/mszh-zlib/mszh
          files=(
            mszh_rgb24.avi
            mszh_rgb24_nocomp.avi
            mszh_yuv111.avi
            mszh_yuv111_nocomp.avi
            mszh_yuv211.avi
            mszh_yuv211_nocomp.avi
            mszh_yuv411.avi
            mszh_yuv411_multithread.avi
            mszh_yuv411_nocomp.avi
            mszh_yuv420.avi
            mszh_yuv420_nocomp.avi
            mszh_yuv422.avi
            mszh_yuv422_nocomp.avi
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "/tmp/mszh-samples/$file"
          done
          cd /tmp/mszh-samples
          cat > expected.md5 <<'EOF'
          f158c1abdd182d5e473fd276bafa6479  mszh_rgb24.avi
          b05a460f6d87740c29951281fe5cad5b  mszh_rgb24_nocomp.avi
          e1c8f262e3195e981068a4d21b1b64ea  mszh_yuv111.avi
          0921950e997300f31227d82b776bc1ec  mszh_yuv111_nocomp.avi
          f010322765e64c13f4d2118f37a845a7  mszh_yuv211.avi
          3fdb8269b0c556fbb078b1d535dbb703  mszh_yuv211_nocomp.avi
          3ab51fc5e956561a796e761d9e7eb833  mszh_yuv411.avi
          b747fab63cf20d28ff941e340f9da94f  mszh_yuv411_multithread.avi
          faac9c5d478f8d0f9ed4a20abbd861d8  mszh_yuv411_nocomp.avi
          2765c6c6a6d48b1c3df6f5c8822e1a7b  mszh_yuv420.avi
          ba08ac1bad95c59fd2cff228186a29ad  mszh_yuv420_nocomp.avi
          fc8c302ff2b1edd3e4a927f8a903f452  mszh_yuv422.avi
          dbc5ed28f514c1648f712b5dd322fa6a  mszh_yuv422_nocomp.avi
          EOF
          sed -i 's/^          //' expected.md5
          md5sum --check expected.md5

      - name: Add temporary native-frame dump mode
        shell: python
        run: |
          from pathlib import Path

          program = Path('Tools/parity/Decode/Program.cs')
          text = program.read_text()
          marker = '// Every frame of an animation, rather than the one a still viewer would draw.'
          block = r'''
          // Temporary corpus-oracle path: writes decoder-native bytes without RGB conversion.
          if (args[0] == "--native-frames") {
            if (args.Length < 3) {
              Console.Error.WriteLine("usage: Decode --native-frames <file> <output directory>");
              return 2;
            }

            var animation = new FileInfo(args[1]);
            var into = args[2];
            Directory.CreateDirectory(into);
            var containers = VideoParity.ContainersClaiming(animation);
            if (containers.Count == 0) {
              Console.Error.WriteLine($"no container claims {animation.Name}");
              return 2;
            }

            return VideoParity.WriteNativeFrames(animation, into, containers[0]);
          }

          '''
          if marker not in text:
              raise SystemExit('Program.cs insertion marker not found')
          program.write_text(text.replace(marker, block + marker, 1))

          parity = Path('Tools/parity/Decode/VideoParity.cs')
          text = parity.read_text()
          method = r'''

            /// <summary>Writes every decoded frame in its native RawImage byte layout for codec-oracle comparisons.</summary>
            internal static int WriteNativeFrames(FileInfo source, string into, VideoFormatEntry entry) {
              var bytes = File.ReadAllBytes(source.FullName);
              IReadOnlyList<MediaStreamInfo> streams;
              try {
                streams = entry.ReadStreams(bytes);
              } catch (Exception failure) {
                Console.Error.WriteLine($"{source.Name}: {entry.Name} would not open it — {failure.GetType().Name}: {failure.Message}");
                return 1;
              }

              var video = streams.FirstOrDefault(s => s.Kind == MediaStreamKind.Video);
              if (video == null) {
                Console.Error.WriteLine($"{source.Name}: {entry.Name} holds no video stream");
                return 1;
              }

              try {
                VideoFormatRegistry.CreateDecoder(video);
              } catch (Exception failure) {
                Console.Error.WriteLine($"{source.Name}: {failure.GetType().Name}: {failure.Message}");
                return 1;
              }

              var frame = 0;
              try {
                foreach (var decoded in _Frames(entry, bytes, video)) {
                  var picture = decoded.Image;
                  var wanted = picture.MinimumPixelDataLength;
                  if (wanted > int.MaxValue || picture.PixelData.LongLength < wanted) {
                    Console.Error.WriteLine($"{source.Name}: frame {frame} carries too few native bytes for {picture.Width}x{picture.Height} {picture.Format}");
                    return 1;
                  }

                  var path = Path.Combine(into, $"{source.Name}.{frame:D2}.{picture.Format}.raw");
                  File.WriteAllBytes(path, picture.PixelData.AsSpan(0, (int)wanted).ToArray());
                  Console.WriteLine($"{path}\t{picture.Width}x{picture.Height}\t{picture.Format}\tpts={decoded.PresentationTimestamp}");
                  ++frame;
                }
              } catch (Exception failure) {
                Console.Error.WriteLine($"{source.Name}: frame {frame} — {failure.GetType().Name}: {failure.Message}");
                return 1;
              }

              Console.WriteLine($"{entry.Name}: {frame} native frame(s) from {source.Name}");
              return frame == 0 ? 1 : 0;
            }
          '''
          at = text.rfind('\n}')
          if at < 0:
              raise SystemExit('VideoParity.cs class terminator not found')
          parity.write_text(text[:at] + method + text[at:])

      - name: Build parity decoder
        run: dotnet build Tools/parity/Decode/Decode.csproj -c Release --nologo

      - name: Decode corpus natively with PNGCrushCS and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mszh-ours /tmp/mszh-ffmpeg
          mkdir -p /tmp/mszh-ours /tmp/mszh-ffmpeg
          for path in /tmp/mszh-samples/*.avi; do
            file=$(basename "$path")
            mkdir -p "/tmp/mszh-ours/$file"
            case "$file" in
              mszh_rgb24*) pix_fmt=bgr24 ;;
              mszh_yuv111*) pix_fmt=yuv444p ;;
              mszh_yuv211*|mszh_yuv422*) pix_fmt=yuv422p ;;
              mszh_yuv411*) pix_fmt=yuv411p ;;
              mszh_yuv420*) pix_fmt=yuv420p ;;
              *) echo "no oracle pixel format for $file" >&2; exit 1 ;;
            esac
            echo "=== $file ($pix_fmt) ==="
            dotnet run --project Tools/parity/Decode/Decode.csproj -c Release --no-build -- --native-frames "$path" "/tmp/mszh-ours/$file"
            ffmpeg -hide_banner -loglevel error -y -i "$path" -map 0:v:0 -an -sn -dn -vsync 0 -pix_fmt "$pix_fmt" -f rawvideo "/tmp/mszh-ffmpeg/$file.raw"
          done

      - name: Compare native decoded samples byte for byte
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          ours_root = Path('/tmp/mszh-ours')
          ff_root = Path('/tmp/mszh-ffmpeg')
          sample_root = Path('/tmp/mszh-samples')

          def dimensions(path: Path):
              out = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'v:0',
                  '-show_entries', 'stream=width,height', '-of', 'csv=p=0:s=x', str(path)
              ], text=True).strip()
              width, height = map(int, out.split('x'))
              return width, height

          def yuv411_from_expanded_444(data: bytes, width: int, height: int):
              samples = width * height
              if len(data) != samples * 3:
                  raise ValueError(f'expanded 4:1:1 frame has {len(data)} bytes, expected {samples * 3}')
              if width % 4:
                  raise ValueError(f'4:1:1 corpus width {width} is not divisible by four')
              y = data[:samples]
              cb444 = data[samples:samples * 2]
              cr444 = data[samples * 2:]
              cb = bytearray()
              cr = bytearray()
              for row in range(height):
                  base = row * width
                  for x in range(0, width, 4):
                      c = cb444[base + x]
                      r = cr444[base + x]
                      if cb444[base + x:base + x + 4] != bytes([c]) * 4:
                          raise ValueError(f'Cb is not constant across row {row}, columns {x}..{x + 3}')
                      if cr444[base + x:base + x + 4] != bytes([r]) * 4:
                          raise ValueError(f'Cr is not constant across row {row}, columns {x}..{x + 3}')
                      cb.append(c)
                      cr.append(r)
              return y + bytes(cb) + bytes(cr)

          failures = []
          total_frames = 0
          for ours_dir in sorted(p for p in ours_root.iterdir() if p.is_dir()):
              name = ours_dir.name
              width, height = dimensions(sample_root / name)
              frames = sorted(ours_dir.glob('*.raw'))
              if not frames:
                  failures.append(f'{name}: PNGCrushCS wrote no native frames')
                  continue

              ours = bytearray()
              for frame in frames:
                  data = frame.read_bytes()
                  if 'yuv411' in name:
                      data = yuv411_from_expanded_444(data, width, height)
                  ours += data

              ref = (ff_root / f'{name}.raw').read_bytes()
              total_frames += len(frames)
              if bytes(ours) == ref:
                  print(f'{name}: {len(frames)} frame(s), {len(ref)} native bytes — exact')
                  continue

              common = min(len(ours), len(ref))
              first = next((i for i in range(common) if ours[i] != ref[i]), None)
              if first is None:
                  failures.append(f'{name}: byte lengths differ ours={len(ours)} ffmpeg={len(ref)} with common prefix identical')
                  continue
              failures.append(
                  f'{name}: first native mismatch byte {first}: ours={ours[first]} ffmpeg={ref[first]}; '
                  f'lengths ours={len(ours)} ffmpeg={len(ref)}'
              )

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

          print(f'All {total_frames} decoded frames matched FFmpeg byte-for-byte in native sample space.')
