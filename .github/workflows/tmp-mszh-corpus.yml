name: Temporary MSZH corpus validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch archived MSZH samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mszh-samples
          base=https://samples.ffmpeg.org/V-codecs/mszh-zlib/mszh
          files=(
            mszh_rgb24.avi
            mszh_rgb24_nocomp.avi
            mszh_yuv111.avi
            mszh_yuv111_nocomp.avi
            mszh_yuv211.avi
            mszh_yuv211_nocomp.avi
            mszh_yuv411.avi
            mszh_yuv411_multithread.avi
            mszh_yuv411_nocomp.avi
            mszh_yuv420.avi
            mszh_yuv420_nocomp.avi
            mszh_yuv422.avi
            mszh_yuv422_nocomp.avi
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "/tmp/mszh-samples/$file"
          done
          cd /tmp/mszh-samples
          cat > expected.md5 <<'EOF'
          f158c1abdd182d5e473fd276bafa6479  mszh_rgb24.avi
          b05a460f6d87740c29951281fe5cad5b  mszh_rgb24_nocomp.avi
          e1c8f262e3195e981068a4d21b1b64ea  mszh_yuv111.avi
          0921950e997300f31227d82b776bc1ec  mszh_yuv111_nocomp.avi
          f010322765e64c13f4d2118f37a845a7  mszh_yuv211.avi
          3fdb8269b0c556fbb078b1d535dbb703  mszh_yuv211_nocomp.avi
          3ab51fc5e956561a796e761d9e7eb833  mszh_yuv411.avi
          b747fab63cf20d28ff941e340f9da94f  mszh_yuv411_multithread.avi
          faac9c5d478f8d0f9ed4a20abbd861d8  mszh_yuv411_nocomp.avi
          2765c6c6a6d48b1c3df6f5c8822e1a7b  mszh_yuv420.avi
          ba08ac1bad95c59fd2cff228186a29ad  mszh_yuv420_nocomp.avi
          fc8c302ff2b1edd3e4a927f8a903f452  mszh_yuv422.avi
          dbc5ed28f514c1648f712b5dd322fa6a  mszh_yuv422_nocomp.avi
          EOF
          sed -i 's/^          //' expected.md5
          md5sum --check expected.md5

      - name: Build parity decoder
        run: dotnet build Tools/parity/Decode/Decode.csproj -c Release --nologo

      - name: Decode corpus with PNGCrushCS and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mszh-ours /tmp/mszh-ffmpeg
          mkdir -p /tmp/mszh-ours /tmp/mszh-ffmpeg
          for path in /tmp/mszh-samples/*.avi; do
            file=$(basename "$path")
            mkdir -p "/tmp/mszh-ours/$file" "/tmp/mszh-ffmpeg/$file"
            echo "=== $file ==="
            dotnet run --project Tools/parity/Decode/Decode.csproj -c Release --no-build -- --frames "$path" "/tmp/mszh-ours/$file"
            ffmpeg -hide_banner -loglevel error -y -i "$path" -map 0:v:0 -an -sn -dn -vsync 0 -start_number 0 "/tmp/mszh-ffmpeg/$file/$file.%02d.ppm"
          done

      - name: Compare decoded pixels byte for byte
        shell: python
        run: |
          from pathlib import Path
          import sys

          ours_root = Path('/tmp/mszh-ours')
          ff_root = Path('/tmp/mszh-ffmpeg')

          def ppm(path: Path):
              data = path.read_bytes()
              if not data.startswith(b'P6'):
                  raise ValueError(f'{path}: not P6 PPM')
              at = 2
              tokens = []
              while len(tokens) < 3:
                  while at < len(data) and data[at] in b' \t\r\n':
                      at += 1
                  if at < len(data) and data[at] == ord('#'):
                      while at < len(data) and data[at] not in b'\r\n':
                          at += 1
                      continue
                  start = at
                  while at < len(data) and data[at] not in b' \t\r\n':
                      at += 1
                  tokens.append(data[start:at])
              while at < len(data) and data[at] in b' \t\r\n':
                  at += 1
              width, height, maximum = map(int, tokens)
              if maximum != 255:
                  raise ValueError(f'{path}: max value {maximum}')
              pixels = data[at:]
              expected = width * height * 3
              if len(pixels) != expected:
                  raise ValueError(f'{path}: {len(pixels)} pixel bytes, expected {expected}')
              return width, height, pixels

          failures = []
          for ours_dir in sorted(p for p in ours_root.iterdir() if p.is_dir()):
              name = ours_dir.name
              ff_dir = ff_root / name
              ours = sorted(ours_dir.glob('*.ppm'))
              ref = sorted(ff_dir.glob('*.ppm'))
              if len(ours) != len(ref):
                  failures.append(f'{name}: frame count ours={len(ours)} ffmpeg={len(ref)}')
                  continue

              for i, (left_path, right_path) in enumerate(zip(ours, ref)):
                  lw, lh, left = ppm(left_path)
                  rw, rh, right = ppm(right_path)
                  if (lw, lh) != (rw, rh):
                      failures.append(f'{name} frame {i}: geometry ours={lw}x{lh} ffmpeg={rw}x{rh}')
                      continue
                  if left == right:
                      continue

                  diffs = [abs(a - b) for a, b in zip(left, right)]
                  differing = sum(d != 0 for d in diffs)
                  first = next(j for j, d in enumerate(diffs) if d)
                  failures.append(
                      f'{name} frame {i}: {differing}/{len(left)} RGB bytes differ; '
                      f'max abs diff={max(diffs)}, first byte {first}: ours={left[first]} ffmpeg={right[first]}'
                  )

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)

          print('Every decoded RGB byte of every frame matched FFmpeg for all MSZH corpus files.')
