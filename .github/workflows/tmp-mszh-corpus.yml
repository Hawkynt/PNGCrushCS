name: Temporary MSZH corpus diagnostics

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch archived MSZH samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mszh-samples
          base=https://samples.ffmpeg.org/V-codecs/mszh-zlib/mszh
          cat > /tmp/mszh-samples/expected.md5 <<'EOF'
          f158c1abdd182d5e473fd276bafa6479  mszh_rgb24.avi
          b05a460f6d87740c29951281fe5cad5b  mszh_rgb24_nocomp.avi
          e1c8f262e3195e981068a4d21b1b64ea  mszh_yuv111.avi
          e1c8f262e3195e981068a4d21b1b64ea  mszh_yuv111_invert.avi
          0921950e997300f31227d82b776bc1ec  mszh_yuv111_nocomp.avi
          f010322765e64c13f4d2118f37a845a7  mszh_yuv211.avi
          3fdb8269b0c556fbb078b1d535dbb703  mszh_yuv211_nocomp.avi
          3ab51fc5e956561a796e761d9e7eb833  mszh_yuv411.avi
          b747fab63cf20d28ff941e340f9da94f  mszh_yuv411_multithread.avi
          faac9c5d478f8d0f9ed4a20abbd861d8  mszh_yuv411_nocomp.avi
          03a7c154b765466c75802ac23f6b2a7e  mszh_yuv411_nocomp_nullframe.avi
          2765c6c6a6d48b1c3df6f5c8822e1a7b  mszh_yuv420.avi
          ba08ac1bad95c59fd2cff228186a29ad  mszh_yuv420_nocomp.avi
          4acc273d658657acb8d7517171f8d48f  mszh_yuv420_nullframe.avi
          fc8c302ff2b1edd3e4a927f8a903f452  mszh_yuv422.avi
          dbc5ed28f514c1648f712b5dd322fa6a  mszh_yuv422_nocomp.avi
          EOF
          sed -i 's/^          //' /tmp/mszh-samples/expected.md5
          while read -r hash file; do
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "/tmp/mszh-samples/$file"
          done < /tmp/mszh-samples/expected.md5
          cd /tmp/mszh-samples
          md5sum --check expected.md5

      - name: Add temporary native-frame dump mode
        shell: python
        run: |
          from pathlib import Path

          program = Path('Tools/parity/Decode/Program.cs')
          text = program.read_text()
          marker = '// Every frame of an animation, rather than the one a still viewer would draw.'
          block = r'''
          // Temporary corpus-oracle path: writes decoder-native bytes without RGB conversion.
          if (args[0] == "--native-frames") {
            if (args.Length < 3) {
              Console.Error.WriteLine("usage: Decode --native-frames <file> <output directory>");
              return 2;
            }

            var animation = new FileInfo(args[1]);
            var into = args[2];
            Directory.CreateDirectory(into);
            var containers = VideoParity.ContainersClaiming(animation);
            if (containers.Count == 0) {
              Console.Error.WriteLine($"no container claims {animation.Name}");
              return 2;
            }

            return VideoParity.WriteNativeFrames(animation, into, containers[0]);
          }

          '''
          if marker not in text:
              raise SystemExit('Program.cs insertion marker not found')
          program.write_text(text.replace(marker, block + marker, 1))

          parity = Path('Tools/parity/Decode/VideoParity.cs')
          text = parity.read_text()
          method = r'''

            /// <summary>Writes every decoded frame in its native RawImage byte layout for codec-oracle comparisons.</summary>
            internal static int WriteNativeFrames(FileInfo source, string into, VideoFormatEntry entry) {
              var bytes = File.ReadAllBytes(source.FullName);
              IReadOnlyList<MediaStreamInfo> streams;
              try {
                streams = entry.ReadStreams(bytes);
              } catch (Exception failure) {
                Console.Error.WriteLine($"{source.Name}: {entry.Name} would not open it — {failure.GetType().Name}: {failure.Message}");
                return 1;
              }

              var video = streams.FirstOrDefault(s => s.Kind == MediaStreamKind.Video);
              if (video == null) {
                Console.Error.WriteLine($"{source.Name}: {entry.Name} holds no video stream");
                return 1;
              }

              var frame = 0;
              try {
                foreach (var decoded in _Frames(entry, bytes, video)) {
                  var picture = decoded.Image;
                  var wanted = picture.MinimumPixelDataLength;
                  if (wanted > int.MaxValue || picture.PixelData.LongLength < wanted) {
                    Console.Error.WriteLine($"{source.Name}: frame {frame} carries too few native bytes for {picture.Width}x{picture.Height} {picture.Format}");
                    return 1;
                  }

                  var path = Path.Combine(into, $"{source.Name}.{frame:D4}.{picture.Format}.raw");
                  File.WriteAllBytes(path, picture.PixelData.AsSpan(0, (int)wanted).ToArray());
                  Console.WriteLine($"{path}\t{picture.Width}x{picture.Height}\t{picture.Format}\tpts={decoded.PresentationTimestamp}");
                  ++frame;
                }
              } catch (Exception failure) {
                Console.Error.WriteLine($"{source.Name}: frame {frame} — {failure.GetType().Name}: {failure.Message}");
                return 1;
              }

              Console.WriteLine($"{entry.Name}: {frame} native frame(s) from {source.Name}");
              return frame == 0 ? 1 : 0;
            }
          '''
          at = text.rfind('\n}')
          if at < 0:
              raise SystemExit('VideoParity.cs class terminator not found')
          parity.write_text(text[:at] + method + text[at:])

      - name: Build parity decoder
        run: dotnet build Tools/parity/Decode/Decode.csproj -c Release --nologo

      - name: Compare AVI packet boundaries with ffprobe
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/mszh-packets
          status=0
          for path in /tmp/mszh-samples/*.avi; do
            file=$(basename "$path")
            echo "=== packets $file ==="
            dotnet run --project Tools/parity/Decode/Decode.csproj -c Release --no-build -- --packets "$path" > "/tmp/mszh-packets/$file.ours" 2> "/tmp/mszh-packets/$file.ours.err" || status=1
            ffprobe -v error -select_streams v:0 -show_entries packet=stream_index,pts,dts,size,flags -of csv=p=0 "$path" > "/tmp/mszh-packets/$file.ffprobe" || status=1
            if diff -u "/tmp/mszh-packets/$file.ffprobe" "/tmp/mszh-packets/$file.ours"; then
              echo "$file: packet metadata exact"
            else
              echo "$file: packet metadata differs"
              status=1
            fi
            cat "/tmp/mszh-packets/$file.ours.err"
          done
          echo "packet parity status=$status"

      - name: Decode corpus natively with PNGCrushCS and FFmpeg
        shell: bash
        run: |
          set -u
          rm -rf /tmp/mszh-ours /tmp/mszh-ffmpeg-forced /tmp/mszh-ffmpeg-native
          mkdir -p /tmp/mszh-ours /tmp/mszh-ffmpeg-forced /tmp/mszh-ffmpeg-native
          for path in /tmp/mszh-samples/*.avi; do
            file=$(basename "$path")
            mkdir -p "/tmp/mszh-ours/$file"
            case "$file" in
              mszh_rgb24*) pix_fmt=bgr24 ;;
              mszh_yuv111*) pix_fmt=yuv444p ;;
              mszh_yuv211*|mszh_yuv422*) pix_fmt=yuv422p ;;
              mszh_yuv411*) pix_fmt=yuv411p ;;
              mszh_yuv420*) pix_fmt=yuv420p ;;
              *) echo "no oracle pixel format for $file" >&2; continue ;;
            esac
            echo "=== decode $file ($pix_fmt) ==="
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt,nb_frames -of default=nw=1 "$path" || true
            ffprobe -v error -select_streams v:0 -show_entries frame=pix_fmt,pkt_size,pts -of csv=p=0 "$path" | head -20 || true
            dotnet run --project Tools/parity/Decode/Decode.csproj -c Release --no-build -- --native-frames "$path" "/tmp/mszh-ours/$file" || echo "OURS_DECODE_FAILED $file"
            ffmpeg -hide_banner -loglevel error -y -i "$path" -map 0:v:0 -an -sn -dn -vsync 0 -pix_fmt "$pix_fmt" -f rawvideo "/tmp/mszh-ffmpeg-forced/$file.raw" || echo "FFMPEG_FORCED_FAILED $file"
            ffmpeg -hide_banner -loglevel error -y -i "$path" -map 0:v:0 -an -sn -dn -vsync 0 -f rawvideo "/tmp/mszh-ffmpeg-native/$file.raw" || echo "FFMPEG_NATIVE_FAILED $file"
            sha256sum "/tmp/mszh-ffmpeg-forced/$file.raw" "/tmp/mszh-ffmpeg-native/$file.raw" 2>/dev/null || true
            if cmp -s "/tmp/mszh-ffmpeg-forced/$file.raw" "/tmp/mszh-ffmpeg-native/$file.raw"; then
              echo "$file: FFmpeg native output equals forced $pix_fmt"
            else
              echo "$file: FFmpeg native output differs from forced $pix_fmt"
            fi
          done

      - name: Diagnose native frame and plane differences
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          ours_root = Path('/tmp/mszh-ours')
          ff_root = Path('/tmp/mszh-ffmpeg-forced')
          sample_root = Path('/tmp/mszh-samples')

          def probe(path: Path):
              out = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'v:0',
                  '-show_entries', 'stream=width,height', '-of', 'csv=p=0:s=x', str(path)
              ], text=True).strip()
              return tuple(map(int, out.split('x')))

          def sha(data: bytes):
              return hashlib.sha256(data).hexdigest()

          def layout(name: str, width: int, height: int):
              y = width * height
              if 'rgb24' in name:
                  return [('BGR', width * height * 3)]
              if 'yuv111' in name:
                  return [('Y', y), ('U', y), ('V', y)]
              if 'yuv211' in name or 'yuv422' in name:
                  c = ((width + 1) // 2) * height
                  return [('Y', y), ('U', c), ('V', c)]
              if 'yuv411' in name:
                  c = ((width + 3) // 4) * height
                  return [('Y', y), ('U', c), ('V', c)]
              if 'yuv420' in name:
                  c = ((width + 1) // 2) * ((height + 1) // 2)
                  return [('Y', y), ('U', c), ('V', c)]
              raise ValueError(name)

          def collapse_411(data: bytes, width: int, height: int):
              samples = width * height
              if len(data) != samples * 3:
                  raise ValueError(f'expanded 4:1:1 frame has {len(data)} bytes, expected {samples * 3}')
              y = data[:samples]
              u444 = data[samples:samples * 2]
              v444 = data[samples * 2:]
              u = bytearray()
              v = bytearray()
              for row in range(height):
                  base = row * width
                  for x in range(0, width, 4):
                      u.append(u444[base + x])
                      v.append(v444[base + x])
              return y + bytes(u) + bytes(v)

          unexpected = []
          print('=== FRAME/PLANE SHA256 ===')
          for sample in sorted(sample_root.glob('*.avi')):
              name = sample.name
              width, height = probe(sample)
              planes = layout(name, width, height)
              frame_size = sum(size for _, size in planes)
              ref_path = ff_root / f'{name}.raw'
              if not ref_path.exists():
                  unexpected.append(f'{name}: FFmpeg forced output missing')
                  continue
              ref = ref_path.read_bytes()
              if len(ref) % frame_size:
                  unexpected.append(f'{name}: FFmpeg length {len(ref)} is not a multiple of frame size {frame_size}')
                  continue
              ref_frames = [ref[i:i + frame_size] for i in range(0, len(ref), frame_size)]
              ours_paths = sorted((ours_root / name).glob('*.raw'))
              ours_frames = []
              for path in ours_paths:
                  data = path.read_bytes()
                  if 'yuv411' in name:
                      data = collapse_411(data, width, height)
                  ours_frames.append(data)
              print(f'{name}: ours_frames={len(ours_frames)} ffmpeg_frames={len(ref_frames)} frame_size={frame_size}')
              if len(ours_frames) != len(ref_frames):
                  unexpected.append(f'{name}: frame count ours={len(ours_frames)} ffmpeg={len(ref_frames)}')
              for index, (ours, expected) in enumerate(zip(ours_frames, ref_frames)):
                  print(f'  frame {index}: ours={sha(ours)} ffmpeg={sha(expected)} exact={ours == expected}')
                  offset = 0
                  for plane_name, size in planes:
                      a = ours[offset:offset + size]
                      b = expected[offset:offset + size]
                      print(f'    {plane_name}: ours={sha(a)} ffmpeg={sha(b)} exact={a == b}')
                      offset += size
                  if ours != expected:
                      common = min(len(ours), len(expected))
                      first = next((i for i in range(common) if ours[i] != expected[i]), None)
                      if first is None:
                          print(f'    length mismatch ours={len(ours)} ffmpeg={len(expected)}')
                          continue
                      plane_start = 0
                      plane = '?'
                      local = first
                      plane_size = 0
                      for plane_name, size in planes:
                          if first < plane_start + size:
                              plane = plane_name
                              local = first - plane_start
                              plane_size = size
                              break
                          plane_start += size
                      if plane == 'Y':
                          row, col = divmod(local, width)
                      elif plane in ('U', 'V'):
                          if 'yuv420' in name:
                              pw = (width + 1) // 2
                          elif 'yuv411' in name:
                              pw = (width + 3) // 4
                          else:
                              pw = (width + 1) // 2
                          row, col = divmod(local, pw)
                      else:
                          row, col = divmod(local, width * 3)
                      lo = max(0, first - 16)
                      hi = min(common, first + 17)
                      print(f'    FIRST_MISMATCH absolute={first} plane={plane} local={local}/{plane_size} row={row} col={col} ours={ours[first]} ffmpeg={expected[first]}')
                      print(f'    ours[{lo}:{hi}]={ours[lo:hi].hex()}')
                      print(f'    ffmp[{lo}:{hi}]={expected[lo:hi].hex()}')

          print('=== SUMMARY ===')
          if unexpected:
              print('\n'.join(unexpected))
          else:
              print('frame counts/lengths were structurally comparable for every sample')
