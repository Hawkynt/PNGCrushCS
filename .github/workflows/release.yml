name: Release

# Stable release — MANUAL dispatch only. Computes the repo version (version.pl),
# stamps per-package versions, publishes, and tags v<version>.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      # Both OS legs still run the whole suite; only the coverage report is skipped. It takes about
      # two hours on its own and every job below waits on this one, so a release spent longer
      # producing a report than shipping the packages.
      skip-coverage: true

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(perl .github/workflows/scripts/version.pl)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-kind: release
      changelog-flag: --release v${{ needs.version.outputs.version }}

  nuget:
    # Pack and publish the Hawkynt.FileFormats.Images public NuGet meta-package.
    # Same versioning convention as everything else in the repo: csproj declares
    # MAJOR.MINOR.PATCH, then version.pl --stamp appends .BUILD where BUILD is
    # the git rev-list count, producing e.g. 1.0.0.234 at pack time.
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for the short-lived OIDC token that nuget.org's Trusted Publishing
      # exchanges for a one-hour API key. Without this the login step below cannot mint a token at
      # all, and the push falls back to the stored NUGET_TOKEN.
      id-token: write
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Checkout CompressionWorkbench (sibling)
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Stamp version into csprojs
        working-directory: PNGCrushCS
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Pack Hawkynt.FileFormats.Images
        working-directory: PNGCrushCS
        run: dotnet pack Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj -c Release -o ./packages --nologo

      - name: Pack Hawkynt.ImageTransformUI
        working-directory: PNGCrushCS
        run: dotnet pack Hawkynt.ImageTransformUI/Hawkynt.ImageTransformUI.csproj -c Release -o ./packages --nologo

      # Both packages have to exist before anything is pushed. `dotnet pack` can succeed while
      # producing nothing for a project (IsPackable off, a renamed PackageId, a meta-package whose
      # bundling target found no DLLs), and the push loop below globs — so a missing package would
      # push the other one and finish green.
      - name: Verify both packages were produced
        working-directory: PNGCrushCS
        run: |
          ls -la ./packages/ || { echo "::error::pack produced no packages directory"; exit 1; }
          for id in Hawkynt.FileFormats.Images Hawkynt.ImageTransformUI; do
            if ! ls ./packages/"$id".*.nupkg >/dev/null 2>&1; then
              echo "::error::no .nupkg was produced for $id"
              exit 1
            fi
          done

      # Trusted Publishing: nuget.org exchanges a GitHub OIDC token for an API key valid one hour,
      # so no long-lived secret has to exist. It needs a policy on nuget.org (your username ▸ Trusted
      # Publishing) naming owner `Hawkynt`, repository `PNGCrushCS` and workflow file `release.yml`.
      # Until that policy exists this step fails and the push below falls back to NUGET_TOKEN, so
      # adopting it is a nuget.org-side change that needs no second commit here.
      - name: NuGet login (OIDC → short-lived key)
        id: nugetlogin
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        working-directory: PNGCrushCS
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.NUGET_API_KEY }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -n "$OIDC_KEY" ]; then
            echo "Publishing with a short-lived Trusted Publishing key."
            KEY="$OIDC_KEY"
          elif [ -n "$NUGET_TOKEN" ]; then
            echo "::warning::Trusted Publishing is not configured; falling back to the stored NUGET_TOKEN."
            KEY="$NUGET_TOKEN"
          else
            # This workflow is manual-dispatch only, so there is no PR or fork case to skip for: no
            # credential means the release is about to be cut with nothing published, which is the
            # failure this step exists to prevent rather than to wave through.
            echo "::error::No publishing credential — configure Trusted Publishing or set NUGET_TOKEN."
            exit 1
          fi

          for pkg in ./packages/*.nupkg; do
            echo "Pushing $(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --api-key "$KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # "Your package was pushed" only means nuget.org accepted it for validation. A package can be
      # accepted and then never become available — which is exactly what happened to
      # Hawkynt.FileFormats.Images 1.0.0.7 in run 26947213701: it pushed, reported Created, and the
      # package page is still a 404. Nothing downstream noticed, because the push had exited 0.
      - name: Wait for the packages to become available
        working-directory: PNGCrushCS
        run: |
          fail=0
          for pkg in ./packages/*.nupkg; do
            base=$(basename "$pkg" .nupkg)
            # "Id.1.2.3.4" -> id, version. The version is the trailing dotted-numeric run.
            version=$(echo "$base" | grep -oE '[0-9]+(\.[0-9]+)*$')
            id=${base%.$version}
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')

            echo "Waiting for $id $version…"
            found=0
            for _ in $(seq 1 60); do
              if curl -sf "https://api.nuget.org/v3-flatcontainer/$lower/index.json" \
                   | grep -q "\"$version\""; then
                echo "  available"
                found=1
                break
              fi
              sleep 15
            done

            if [ "$found" -ne 1 ]; then
              echo "::error::$id $version was pushed but never became available on nuget.org — it likely failed validation. Check the rejection mail on the nuget.org account."
              fail=1
            fi
          done
          exit $fail

      - name: Upload .nupkg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: PNGCrushCS/packages/*.nupkg

  publish:
    # Also waits on nuget: a release tagged v<version> whose packages never reached nuget.org is a
    # release in name only, and until now that could happen silently — publish did not depend on the
    # push, so a failed or skipped nuget job still produced a green release.
    needs: [version, build, nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.cli-artifact }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ui-artifact }}
          path: dist

      # Notes = curated header + commit-prefix changelog (+ - * # !), not PR notes.
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node .github/workflows/scripts/update-changelog.mjs --release "v$V" --notes CHANGES.md
          echo "## PNGCrushCS v$V" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<'EOF'

          Windows self-contained single-file **CLI** (`crush.exe`) and **Viewer**
          (WinForms GUI). No runtime installation required.
          EOF
          echo >> RELEASE_NOTES.md
          cat CHANGES.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
