name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual release trigger'
        required: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(perl .github/workflows/scripts/version.pl)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-kind: release
      changelog-flag: --release ${{ github.ref_name }}

  nuget:
    # Pack and publish the Hawkynt.FileFormats.Images public NuGet meta-package.
    # Same versioning convention as everything else in the repo: csproj declares
    # MAJOR.MINOR.PATCH, then version.pl --stamp appends .BUILD where BUILD is
    # the git rev-list count, producing e.g. 1.0.0.234 at pack time.
    needs: [version, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Stamp version into csprojs
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Pack Hawkynt.FileFormats.Images
        run: dotnet pack Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj -c Release -o ./packages --nologo

      - name: Push to NuGet.org
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -z "$NUGET_TOKEN" ]; then
            echo "NUGET_TOKEN secret is not set; skipping push (PR / fork build)."
            exit 0
          fi
          dotnet nuget push ./packages/Hawkynt.FileFormats.Images.*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload .nupkg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hawkynt.FileFormats.Images-nupkg
          path: ./packages/*.nupkg

  publish:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.cli-artifact }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ui-artifact }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body: |
            ## PNGCrushCS v${{ needs.version.outputs.version }}

            - **CLI** (`crush.exe`) — unified image-format optimizer with cross-format conversion.
            - **Viewer** — WinForms GUI supporting 500+ formats with zoom, pan, multi-image navigation, and format conversion.

            Both ship as Windows self-contained single-files — no runtime installation required.
          files: dist/*.zip
          generate_release_notes: true
