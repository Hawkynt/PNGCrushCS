name: Release

# Stable release — MANUAL dispatch only. Computes the repo version (version.pl),
# stamps per-package versions, publishes, and tags v<version>.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(perl .github/workflows/scripts/version.pl)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-kind: release
      changelog-flag: --release v${{ needs.version.outputs.version }}

  nuget:
    # Pack and publish the Hawkynt.FileFormats.Images public NuGet meta-package.
    # Same versioning convention as everything else in the repo: csproj declares
    # MAJOR.MINOR.PATCH, then version.pl --stamp appends .BUILD where BUILD is
    # the git rev-list count, producing e.g. 1.0.0.234 at pack time.
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PNGCrushCS
        uses: actions/checkout@v4
        with:
          path: PNGCrushCS
          fetch-depth: 0

      - name: Checkout CompressionWorkbench (sibling)
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/CompressionWorkbench
          path: CompressionWorkbench
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Stamp version into csprojs
        working-directory: PNGCrushCS
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Pack Hawkynt.FileFormats.Images
        working-directory: PNGCrushCS
        run: dotnet pack Hawkynt.FileFormats.Images/Hawkynt.FileFormats.Images.csproj -c Release -o ./packages --nologo

      - name: Pack Hawkynt.ImageTransformUI
        working-directory: PNGCrushCS
        run: dotnet pack Hawkynt.ImageTransformUI/Hawkynt.ImageTransformUI.csproj -c Release -o ./packages --nologo

      - name: Push to NuGet.org
        working-directory: PNGCrushCS
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -z "$NUGET_TOKEN" ]; then
            echo "NUGET_TOKEN secret is not set; skipping push (PR / fork build)."
            exit 0
          fi
          for pkg in ./packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_TOKEN" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload .nupkg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: PNGCrushCS/packages/*.nupkg

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.cli-artifact }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ui-artifact }}
          path: dist

      # Notes = curated header + commit-prefix changelog (+ - * # !), not PR notes.
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node .github/workflows/scripts/update-changelog.mjs --release "v$V" --notes CHANGES.md
          echo "## PNGCrushCS v$V" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<'EOF'

          Windows self-contained single-file **CLI** (`crush.exe`) and **Viewer**
          (WinForms GUI). No runtime installation required.
          EOF
          echo >> RELEASE_NOTES.md
          cat CHANGES.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
